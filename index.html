<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>SetPace</title>
<style>
  :root {
    --bg: #000;
    --fg: #e8ffff;
    --accent: #00e5ff;
    --muted: #7aa8b0;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #app {
    width: 600px;
    height: 600px;
    display: flex;
    flex-direction: column;
    padding: 14px 20px 10px;
  }
  #heading {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.15;
    min-height: 34px;
    letter-spacing: 0.02em;
  }
  #demoWrap {
    display: none;
    width: 240px;
    height: 200px;
    margin: 8px auto 4px;
    flex-shrink: 0;
  }
  #demoWrap.on { display: block; }
  #demo {
    width: 240px;
    height: 200px;
    display: block;
    background: #000;
  }
  #hero {
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    margin: 14px 0 6px;
    min-height: 72px;
    color: var(--fg);
  }
  #hero.empty {
    min-height: 0;
    margin: 0;
    font-size: 0;
  }
  #app.teach #hero {
    font-size: 26px;
    font-weight: 700;
    min-height: 32px;
    margin: 4px 0 2px;
    color: var(--fg);
  }
  #meta {
    font-size: 18px;
    color: var(--muted);
    min-height: 24px;
    margin-bottom: 8px;
  }
  #actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    min-height: 88px;
    width: 100%;
    border: 2px solid #133a40;
    background: #061416;
    color: var(--fg);
    font-size: 26px;
    font-weight: 700;
    border-radius: 8px;
    text-align: left;
    padding: 0 22px;
    outline: none;
  }
  .btn.primary {
    border-color: var(--accent);
    background: #062228;
    color: var(--accent);
  }
  .btn:focus {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--accent);
    background: #0a3038;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
  }
  #flash.on { opacity: 1; }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: var(--danger);
    padding: 24px;
    font-size: 18px;
    white-space: pre-wrap;
    z-index: 10000;
  }
  .desktop-hint { display: none; }
  @media (min-width: 700px) {
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    #app { outline: 1px solid #333; }
    .desktop-hint {
      display: block;
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: #666;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<pre id="error"></pre>
<div class="desktop-hint">Desktop: arrows + Enter. Glasses: Neural Band / captouch.</div>
<div id="app">
  <div id="heading"></div>
  <div id="demoWrap"><canvas id="demo" width="240" height="200"></canvas></div>
  <div id="hero"></div>
  <div id="meta"></div>
  <div id="actions"></div>
</div>
<script>
(function () {
  "use strict";

  window.onerror = function (msg, src, line, col, err) {
    var el = document.getElementById("error");
    el.style.display = "block";
    el.textContent = String(msg) + "\n" + (src || "") + ":" + line + ":" + col +
      (err && err.stack ? "\n" + err.stack : "");
  };
  window.onunhandledrejection = function (e) {
    window.onerror(String(e.reason && e.reason.message || e.reason), "", 0, 0, e.reason);
  };

  // --- Exercise library (cue ≤28, steps ≤28, name ≤18) ---
  var EX = {
    legpress: {
      id: "legpress", name: "Leg press", unit: "kg",
      cue: "Machine · adjust seat",
      demo: "press",
      steps: [
        "Sit · back flat",
        "Feet mid platform",
        "Unlock handles",
        "Press out slow",
        "Bend knees control"
      ]
    },
    chestpress: {
      id: "chestpress", name: "Chest press", unit: "kg",
      cue: "Machine · seat height",
      demo: "press",
      steps: [
        "Sit · back flat",
        "Handles at chest",
        "Grip firm · wrists",
        "Press out slow",
        "Return with control"
      ]
    },
    latpulldown: {
      id: "latpulldown", name: "Lat pulldown", unit: "kg",
      cue: "Cable · high bar",
      demo: "pulldown",
      steps: [
        "Sit · pin thighs",
        "Wide grip on bar",
        "Chest up slightly",
        "Pull bar to chest",
        "Raise arms slow"
      ]
    },
    shpress: {
      id: "shpress", name: "Shoulder press", unit: "kg",
      cue: "Machine · seat up",
      demo: "press",
      steps: [
        "Sit · back supported",
        "Handles at shoulders",
        "Press up slow",
        "Do not lock hard",
        "Lower with control"
      ]
    },
    cablecurl: {
      id: "cablecurl", name: "Cable curl", unit: "kg",
      cue: "Cable · low pulley",
      demo: "curl",
      steps: [
        "Stand · elbows in",
        "Grip bar underhand",
        "Curl to shoulders",
        "Keep elbows still",
        "Lower slow"
      ]
    },
    plank: {
      id: "plank", name: "Plank", unit: "time",
      cue: "Floor · brace hard",
      demo: "plank",
      steps: [
        "Forearms on floor",
        "Body in one line",
        "Brace abs hard",
        "Breathe steady",
        "Hold the time"
      ]
    },
    incline: {
      id: "incline", name: "Incline press", unit: "kg",
      cue: "Machine · slight up",
      demo: "press",
      steps: [
        "Sit · back on pad",
        "Handles at chest",
        "Press up and out",
        "Stop short of lock",
        "Lower slow"
      ]
    },
    tripush: {
      id: "tripush", name: "Tricep pushdown", unit: "kg",
      cue: "Cable · high pulley",
      demo: "pulldown",
      steps: [
        "Stand · elbows pinned",
        "Grip bar / rope",
        "Push down to hips",
        "Squeeze at bottom",
        "Return slow"
      ]
    },
    legcurl: {
      id: "legcurl", name: "Leg curl", unit: "kg",
      cue: "Machine · pad calves",
      demo: "curl",
      steps: [
        "Lie or sit set",
        "Pad on lower legs",
        "Curl heels to you",
        "Squeeze hamstrings",
        "Lower slow"
      ]
    },
    legext: {
      id: "legext", name: "Leg extension", unit: "kg",
      cue: "Machine · pad shins",
      demo: "press",
      steps: [
        "Sit · back flat",
        "Pad on lower shins",
        "Extend knees out",
        "Do not snap lock",
        "Lower control"
      ]
    },
    calfraise: {
      id: "calfraise", name: "Calf raise", unit: "kg",
      cue: "Machine · toes edge",
      demo: "raise",
      steps: [
        "Toes on platform",
        "Heels hang free",
        "Rise onto toes",
        "Pause at top",
        "Lower heels slow"
      ]
    },
    bwsquat: {
      id: "bwsquat", name: "BW squat", unit: "bodyweight",
      cue: "Floor · own weight",
      demo: "press",
      steps: [
        "Feet shoulder wide",
        "Chest up · brace",
        "Sit hips back",
        "Knees track toes",
        "Stand tall"
      ]
    }
  };

  function setsOf(exId, reps, kg, n, rest) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        exerciseId: exId,
        targetReps: reps,
        targetWeightKg: kg,
        restSec: i === n - 1 ? rest.last : rest.mid
      });
    }
    return out;
  }

  var PLANS = {
    fullbody: {
      id: "fullbody",
      name: "Full body",
      exercises: {
        legpress: EX.legpress,
        chestpress: EX.chestpress,
        latpulldown: EX.latpulldown,
        shpress: EX.shpress,
        cablecurl: EX.cablecurl,
        plank: EX.plank
      },
      sets: []
        .concat(setsOf("legpress", 10, 40, 2, { mid: 90, last: 90 }))
        .concat(setsOf("chestpress", 10, 20, 2, { mid: 90, last: 90 }))
        .concat(setsOf("latpulldown", 10, 25, 2, { mid: 75, last: 75 }))
        .concat(setsOf("shpress", 10, 15, 2, { mid: 75, last: 75 }))
        .concat(setsOf("cablecurl", 12, 12, 2, { mid: 60, last: 60 }))
        .concat(setsOf("plank", 30, null, 2, { mid: 45, last: 0 }))
    },
    upper: {
      id: "upper",
      name: "Upper push",
      exercises: {
        chestpress: EX.chestpress,
        shpress: EX.shpress,
        incline: EX.incline,
        tripush: EX.tripush
      },
      sets: []
        .concat(setsOf("chestpress", 10, 25, 3, { mid: 90, last: 90 }))
        .concat(setsOf("shpress", 10, 15, 3, { mid: 90, last: 75 }))
        .concat(setsOf("incline", 10, 20, 3, { mid: 75, last: 75 }))
        .concat(setsOf("tripush", 12, 20, 3, { mid: 60, last: 0 }))
    },
    legs: {
      id: "legs",
      name: "Legs",
      exercises: {
        legpress: EX.legpress,
        legcurl: EX.legcurl,
        legext: EX.legext,
        calfraise: EX.calfraise,
        bwsquat: EX.bwsquat
      },
      sets: []
        .concat(setsOf("legpress", 10, 40, 3, { mid: 90, last: 90 }))
        .concat(setsOf("legcurl", 12, 25, 3, { mid: 75, last: 75 }))
        .concat(setsOf("legext", 12, 25, 3, { mid: 75, last: 75 }))
        .concat(setsOf("calfraise", 15, 30, 3, { mid: 60, last: 60 }))
        .concat(setsOf("bwsquat", 12, null, 2, { mid: 60, last: 0 }))
    }
  };

  var STORE_KEY = "setpace_session_v2";
  var IDEMPOTENCY_MS = 250;
  var STALE_CUE_MS = 30000;

  function now() { return Date.now(); }

  function clonePlan(id) {
    return JSON.parse(JSON.stringify(PLANS[id]));
  }

  function exerciseOf(plan, set) {
    return plan.exercises[set.exerciseId];
  }

  function setProgress(plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return { current: 0, total: 0 };
    var total = 0;
    var current = 0;
    for (var i = 0; i < plan.sets.length; i++) {
      if (plan.sets[i].exerciseId === set.exerciseId) {
        total++;
        if (i <= cursor) current++;
      }
    }
    return { current: current, total: total };
  }

  function formatWeight(kg) {
    if (kg == null) return "";
    return (kg % 1 === 0 ? String(kg) : kg.toFixed(1)) + " kg";
  }

  function formatClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function heroForSet(set, reps, ex) {
    if (ex && ex.unit === "time") return formatClock(reps);
    if (ex && ex.unit === "bodyweight") return "x " + reps;
    var w = formatWeight(set.targetWeightKg);
    return w ? w + " x " + reps : "x " + reps;
  }

  function needsTeach(state, plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return false;
    var ex = exerciseOf(plan, set);
    if (!ex || !ex.steps || !ex.steps.length) return false;
    return state.taught.indexOf(ex.id) === -1;
  }

  function markTaught(state, plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return;
    var id = set.exerciseId;
    if (state.taught.indexOf(id) === -1) state.taught.push(id);
  }

  // --- Reducer ---
  function idleState(t) {
    return {
      schemaVersion: 2,
      planId: null,
      startedAt: null,
      cursor: 0,
      logged: [],
      phase: "PlanSelect",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      teachStep: 0,
      taught: [],
      paused: false,
      pendingCue: null
    };
  }

  function freshSession(planId, t) {
    return {
      schemaVersion: 2,
      planId: planId,
      startedAt: t,
      cursor: 0,
      logged: [],
      phase: "Teach",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      teachStep: 0,
      taught: [],
      paused: false,
      pendingCue: null
    };
  }

  function enter(state, phase, t) {
    state.phase = phase;
    state.phaseEnteredAt = t;
    return state;
  }

  function clone(state) {
    return JSON.parse(JSON.stringify(state));
  }

  function withinIdempotency(state, t) {
    return t - state.phaseEnteredAt < IDEMPOTENCY_MS;
  }

  function logSet(state, plan, reps, t, adjusted) {
    var set = plan.sets[state.cursor];
    state.logged.push({
      planIndex: state.cursor,
      actualReps: reps,
      actualWeightKg: set.targetWeightKg,
      completedAt: t,
      restStartedAt: null,
      restEndedAt: null,
      restSkipped: false,
      adjusted: !!adjusted
    });
  }

  function goToCursorReadyOrTeach(state, plan, t) {
    state.setStartedAt = null;
    state.adjust = null;
    state.restEndsAt = null;
    if (needsTeach(state, plan, state.cursor)) {
      state.teachStep = 0;
      return enter(state, "Teach", t);
    }
    return enter(state, "SetReady", t);
  }

  function advanceAfterSet(state, plan, t) {
    var finished = plan.sets[state.cursor];
    state.cursor += 1;
    if (state.cursor >= plan.sets.length) {
      state.restEndsAt = null;
      state.setStartedAt = null;
      state.adjust = null;
      return enter(state, "Summary", t);
    }
    if (!finished.restSec) {
      return goToCursorReadyOrTeach(state, plan, t);
    }
    state.restEndsAt = t + finished.restSec * 1000;
    state.setStartedAt = null;
    state.adjust = null;
    var last = state.logged[state.logged.length - 1];
    last.restStartedAt = t;
    return enter(state, "Resting", t);
  }

  function endRest(state, t, skipped, plan) {
    var last = state.logged[state.logged.length - 1];
    if (last) {
      last.restEndedAt = t;
      last.restSkipped = !!skipped;
    }
    state.restEndsAt = null;
    if (state.cursor >= plan.sets.length) {
      return enter(state, "Summary", t);
    }
    return goToCursorReadyOrTeach(state, plan, t);
  }

  function finishTeach(state, plan, t) {
    markTaught(state, plan, state.cursor);
    state.teachStep = 0;
    return enter(state, "SetReady", t);
  }

  function reducer(state, event, t, plan) {
    state = clone(state);

    if (event.t === "VISIBILITY") {
      state.paused = !event.visible;
      if (event.visible && state.phase === "Resting" && state.restEndsAt != null && t >= state.restEndsAt) {
        var overdue = t - state.restEndsAt;
        state = endRest(state, t, false, plan);
        if (overdue <= STALE_CUE_MS) state.pendingCue = "rest_over";
      }
      return state;
    }

    if (event.t === "TICK") {
      if (state.phase === "Resting" && state.restEndsAt != null && t >= state.restEndsAt) {
        state = endRest(state, t, false, plan);
        state.pendingCue = "rest_over";
      }
      return state;
    }

    if (state.paused && event.t !== "SELECT_PLAN") return state;

    if (event.t === "SELECT_PLAN") {
      if (!PLANS[event.planId]) return state;
      plan = clonePlan(event.planId);
      resetPlanTo(event.planId);
      return freshSession(event.planId, t);
    }

    if (event.t === "TEACH_NEXT") {
      if (state.phase !== "Teach") return state;
      if (withinIdempotency(state, t)) return state;
      var exT = exerciseOf(plan, plan.sets[state.cursor]);
      var steps = (exT && exT.steps) || [];
      if (state.teachStep >= steps.length - 1) {
        return finishTeach(state, plan, t);
      }
      state.teachStep += 1;
      state.phaseEnteredAt = t;
      return state;
    }

    if (event.t === "TEACH_SKIP") {
      if (state.phase !== "Teach") return state;
      if (withinIdempotency(state, t)) return state;
      return finishTeach(state, plan, t);
    }

    if (event.t === "HOW_TO") {
      if (state.phase !== "SetReady") return state;
      state.teachStep = 0;
      return enter(state, "Teach", t);
    }

    if (event.t === "PRIMARY") {
      if (withinIdempotency(state, t)) return state;
      if (state.phase === "SetReady") {
        state.setStartedAt = t;
        state.adjust = null;
        return enter(state, "SetActive", t);
      }
      if (state.phase === "SetActive") {
        var reps = state.adjust ? state.adjust.reps : plan.sets[state.cursor].targetReps;
        var adjusted = !!(state.adjust && state.adjust.reps !== plan.sets[state.cursor].targetReps);
        logSet(state, plan, reps, t, adjusted);
        return advanceAfterSet(state, plan, t);
      }
      if (state.phase === "Resting") {
        return endRest(state, t, true, plan);
      }
      return state;
    }

    if (event.t === "ADJUST") {
      if (state.phase !== "SetReady") return state;
      var cur = plan.sets[state.cursor];
      state.adjust = { reps: cur.targetReps };
      return enter(state, "Adjusting", t);
    }

    if (event.t === "ADJUST_DELTA") {
      if (state.phase !== "Adjusting" || !state.adjust) return state;
      state.adjust.reps = Math.max(1, Math.min(50, state.adjust.reps + event.delta));
      return state;
    }

    if (event.t === "CONFIRM") {
      if (state.phase !== "Adjusting") return state;
      return enter(state, "SetReady", t);
    }

    if (event.t === "UNDO") {
      if (state.phase !== "Resting") return state;
      if (withinIdempotency(state, t)) return state;
      var popped = state.logged.pop();
      if (!popped) return state;
      state.cursor = popped.planIndex;
      state.restEndsAt = null;
      state.setStartedAt = popped.completedAt;
      state.adjust = null;
      return enter(state, "SetActive", t);
    }

    if (event.t === "FINISH") {
      if (state.phase !== "Summary") return state;
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      resetPlanTo(null);
      return idleState(t);
    }

    if (event.t === "ADD_SET") {
      if (state.phase !== "Summary") return state;
      var lastSet = plan.sets[plan.sets.length - 1];
      plan.sets.push(JSON.parse(JSON.stringify(lastSet)));
      state.cursor = plan.sets.length - 1;
      state.adjust = null;
      return goToCursorReadyOrTeach(state, plan, t);
    }

    return state;
  }

  // --- Render ---
  function render(state, t, plan) {
    if (!state || state.phase === "PlanSelect" || state.phase === "Idle") {
      return {
        heading: "What today?",
        hero: "",
        meta: "Pick a workout",
        demo: null,
        actions: [
          { id: "plan_full", label: "Full body", event: { t: "SELECT_PLAN", planId: "fullbody" } },
          { id: "plan_upper", label: "Upper push", event: { t: "SELECT_PLAN", planId: "upper" } },
          { id: "plan_legs", label: "Legs", event: { t: "SELECT_PLAN", planId: "legs" } }
        ]
      };
    }

    if (state.phase === "Teach") {
      var tset = plan.sets[state.cursor];
      var tex = exerciseOf(plan, tset);
      var steps = tex.steps || [];
      var idx = Math.min(state.teachStep, Math.max(0, steps.length - 1));
      var last = idx >= steps.length - 1;
      return {
        heading: tex.name,
        hero: steps[idx] || "",
        meta: "Step " + (idx + 1) + "/" + steps.length,
        demo: tex.demo || "press",
        actions: [
          { id: "primary", label: last ? "Got it" : "Next", event: { t: "TEACH_NEXT" } },
          { id: "skip", label: "Skip", event: { t: "TEACH_SKIP" } }
        ]
      };
    }

    if (state.phase === "Adjusting") {
      var aset = plan.sets[state.cursor];
      var aex = exerciseOf(plan, aset);
      return {
        heading: aex.name,
        hero: String(state.adjust.reps) + (aex.unit === "time" ? " sec" : " reps"),
        meta: "Adjust reps",
        demo: null,
        actions: [
          { id: "minus", label: "−1", event: { t: "ADJUST_DELTA", delta: -1 } },
          { id: "plus", label: "+1", event: { t: "ADJUST_DELTA", delta: 1 } },
          { id: "done", label: "Done", event: { t: "CONFIRM" } }
        ]
      };
    }

    if (state.phase === "Summary") {
      var volume = 0;
      for (var i = 0; i < state.logged.length; i++) {
        var L = state.logged[i];
        if (L.actualWeightKg != null) volume += L.actualWeightKg * L.actualReps;
      }
      var mins = Math.round((t - state.startedAt) / 60000);
      return {
        heading: "Done",
        hero: String(state.logged.length) + " sets",
        meta: mins + " min · " + Math.round(volume) + " kg",
        demo: null,
        actions: [
          { id: "primary", label: "Finish", event: { t: "FINISH" } },
          { id: "add", label: "Add set", event: { t: "ADD_SET" } }
        ]
      };
    }

    if (state.phase === "Resting") {
      var remain = Math.max(0, Math.ceil((state.restEndsAt - t) / 1000));
      var next = plan.sets[state.cursor];
      var nex = exerciseOf(plan, next);
      var nprog = setProgress(plan, state.cursor);
      return {
        heading: "Rest",
        hero: formatClock(remain),
        meta: "Next: " + nex.name + " " + nprog.current + "/" + nprog.total,
        demo: null,
        actions: [
          { id: "primary", label: "Skip rest", event: { t: "PRIMARY" } },
          { id: "undo", label: "Undo set", event: { t: "UNDO" } }
        ]
      };
    }

    var set = plan.sets[state.cursor];
    var ex = exerciseOf(plan, set);
    var prog = setProgress(plan, state.cursor);
    var reps = state.adjust ? state.adjust.reps : set.targetReps;
    var hero = heroForSet(set, reps, ex);
    var metaLine = (ex.cue || "") + " · " + prog.current + "/" + prog.total;
    if (metaLine.length > 28) metaLine = (ex.cue || "").slice(0, 18) + " · " + prog.current + "/" + prog.total;

    if (state.phase === "SetActive") {
      return {
        heading: ex.name,
        hero: hero,
        meta: "Set " + prog.current + "/" + prog.total + " · lifting",
        demo: null,
        actions: [{ id: "primary", label: "Done", event: { t: "PRIMARY" } }]
      };
    }

    // SetReady: Start + How to (Adjust omitted — 88px budget with cue)
    return {
      heading: ex.name,
      hero: hero,
      meta: metaLine,
      demo: null,
      actions: [
        { id: "primary", label: "Start set", event: { t: "PRIMARY" } },
        { id: "howto", label: "How to", event: { t: "HOW_TO" } }
      ]
    };
  }

  // --- Canvas demos ---
  var demoCanvas = document.getElementById("demo");
  var demoCtx = demoCanvas.getContext("2d");
  var demoRaf = null;
  var demoKind = null;
  var demoStart = 0;

  function stopDemo() {
    if (demoRaf) {
      cancelAnimationFrame(demoRaf);
      demoRaf = null;
    }
    demoKind = null;
  }

  function strokeFigure(ctx) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#00e5ff";
    ctx.fillStyle = "#00e5ff";
    ctx.lineWidth = 4;
  }

  function head(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function limb(ctx, x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function ease(p) {
    return 0.5 - 0.5 * Math.cos(Math.PI * 2 * p);
  }

  function drawPress(ctx, p) {
    var a = ease(p);
    var push = a * 36;
    strokeFigure(ctx);
    // seat
    ctx.strokeStyle = "#7aa8b0";
    ctx.lineWidth = 3;
    limb(ctx, 40, 155, 120, 155);
    limb(ctx, 55, 155, 55, 175);
    limb(ctx, 105, 155, 105, 175);
    strokeFigure(ctx);
    head(ctx, 78, 70, 12);
    limb(ctx, 78, 82, 78, 120); // torso
    limb(ctx, 78, 120, 55, 155); // thigh
    limb(ctx, 78, 120, 100, 155);
    // arms push forward
    limb(ctx, 78, 95, 110 + push, 90);
    limb(ctx, 78, 95, 110 + push, 105);
    // handles / pad
    ctx.strokeStyle = "#e8ffff";
    ctx.lineWidth = 3;
    limb(ctx, 110 + push, 82, 110 + push, 112);
  }

  function drawPulldown(ctx, p) {
    var a = ease(p);
    var down = a * 40;
    strokeFigure(ctx);
    ctx.strokeStyle = "#7aa8b0";
    ctx.lineWidth = 3;
    limb(ctx, 50, 170, 190, 170); // seat/base
    strokeFigure(ctx);
    head(ctx, 120, 95, 12);
    limb(ctx, 120, 107, 120, 145);
    limb(ctx, 120, 145, 95, 170);
    limb(ctx, 120, 145, 145, 170);
    // arms from high bar
    var handY = 55 + down;
    limb(ctx, 120, 120, 85, handY);
    limb(ctx, 120, 120, 155, handY);
    ctx.strokeStyle = "#e8ffff";
    ctx.lineWidth = 3;
    limb(ctx, 70, handY, 170, handY);
    // cable
    ctx.strokeStyle = "#7aa8b0";
    limb(ctx, 120, 20, 120, handY);
  }

  function drawCurl(ctx, p) {
    var a = ease(p);
    var bend = a * 0.9;
    strokeFigure(ctx);
    head(ctx, 90, 50, 12);
    limb(ctx, 90, 62, 90, 120);
    limb(ctx, 90, 120, 70, 165);
    limb(ctx, 90, 120, 115, 165);
    // upper arm fixed, forearm curls
    var elbowX = 115, elbowY = 95;
    limb(ctx, 90, 80, elbowX, elbowY);
    var handX = elbowX + Math.cos(-0.2 - bend * 1.4) * 40;
    var handY = elbowY + Math.sin(-0.2 - bend * 1.4) * 40;
    limb(ctx, elbowX, elbowY, handX, handY);
    ctx.strokeStyle = "#e8ffff";
    ctx.lineWidth = 3;
    limb(ctx, handX - 8, handY, handX + 8, handY);
  }

  function drawRaise(ctx, p) {
    var a = ease(p);
    var lift = a * 22;
    strokeFigure(ctx);
    head(ctx, 120, 40, 12);
    limb(ctx, 120, 52, 120, 110);
    // legs
    limb(ctx, 120, 110, 100, 150 - lift);
    limb(ctx, 120, 110, 140, 150 - lift);
    // feet / platform
    ctx.strokeStyle = "#7aa8b0";
    ctx.lineWidth = 3;
    limb(ctx, 70, 165, 170, 165);
    strokeFigure(ctx);
    limb(ctx, 95, 150 - lift, 105, 150 - lift);
    limb(ctx, 135, 150 - lift, 145, 150 - lift);
    // heels indicator
    ctx.strokeStyle = "#e8ffff";
    ctx.lineWidth = 3;
    limb(ctx, 100, 150 - lift, 100, 162 - lift * 0.3);
    limb(ctx, 140, 150 - lift, 140, 162 - lift * 0.3);
  }

  function drawPlank(ctx, p) {
    var pulse = 0.85 + 0.15 * Math.sin(p * Math.PI * 2);
    strokeFigure(ctx);
    ctx.globalAlpha = pulse;
    // body line
    head(ctx, 55, 95, 10);
    limb(ctx, 65, 100, 170, 100);
    // arms
    limb(ctx, 75, 100, 70, 130);
    limb(ctx, 75, 100, 85, 130);
    // legs
    limb(ctx, 170, 100, 195, 130);
    limb(ctx, 170, 100, 185, 130);
    ctx.strokeStyle = "#7aa8b0";
    ctx.lineWidth = 3;
    ctx.globalAlpha = 1;
    limb(ctx, 40, 135, 210, 135);
  }

  function drawDemoFrame(kind, t0) {
    var ctx = demoCtx;
    var w = demoCanvas.width;
    var h = demoCanvas.height;
    ctx.clearRect(0, 0, w, h);
    var elapsed = (t0 - demoStart) / 1000;
    var period = kind === "plank" ? 1.6 : 1.4;
    var p = (elapsed % period) / period;
    if (kind === "press") drawPress(ctx, p);
    else if (kind === "pulldown") drawPulldown(ctx, p);
    else if (kind === "curl") drawCurl(ctx, p);
    else if (kind === "raise") drawRaise(ctx, p);
    else if (kind === "plank") drawPlank(ctx, p);
    else drawPress(ctx, p);
  }

  function startDemo(kind) {
    if (!kind) {
      stopDemo();
      return;
    }
    if (demoKind === kind && demoRaf) return;
    stopDemo();
    demoKind = kind;
    demoStart = performance.now();
    function loop(ts) {
      drawDemoFrame(kind, ts);
      demoRaf = requestAnimationFrame(loop);
    }
    demoRaf = requestAnimationFrame(loop);
  }

  // --- Audio + flash ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "square";
      o.frequency.value = 880;
      g.gain.value = 0.0001;
      o.connect(g);
      g.connect(ctx.destination);
      var t0 = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.start(t0);
      o.stop(t0 + 0.4);
      setTimeout(function () {
        try {
          var o2 = ctx.createOscillator();
          var g2 = ctx.createGain();
          o2.type = "square";
          o2.frequency.value = 1175;
          g2.gain.value = 0.0001;
          o2.connect(g2);
          g2.connect(ctx.destination);
          var t1 = ctx.currentTime;
          g2.gain.setValueAtTime(0.0001, t1);
          g2.gain.exponentialRampToValueAtTime(0.18, t1 + 0.02);
          g2.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.28);
          o2.start(t1);
          o2.stop(t1 + 0.32);
        } catch (e2) {}
      }, 180);
    } catch (e) {}
  }

  function flashPulse() {
    var el = document.getElementById("flash");
    var n = 0;
    function beat() {
      el.classList.add("on");
      setTimeout(function () {
        el.classList.remove("on");
        n++;
        if (n < 3) setTimeout(beat, 120);
      }, 180);
    }
    beat();
  }

  function fireCue() {
    playTone();
    flashPulse();
  }

  // --- DOM commit ---
  var appEl = document.getElementById("app");
  var headingEl = document.getElementById("heading");
  var heroEl = document.getElementById("hero");
  var metaEl = document.getElementById("meta");
  var demoWrap = document.getElementById("demoWrap");
  var actionsEl = document.getElementById("actions");
  var lastFocusId = "primary";
  var actionHandlers = {};

  function commit(frame) {
    headingEl.textContent = frame.heading || "";
    heroEl.textContent = frame.hero || "";
    if (!frame.hero) heroEl.classList.add("empty");
    else heroEl.classList.remove("empty");
    metaEl.textContent = frame.meta || "";

    if (frame.demo) {
      appEl.classList.add("teach");
      demoWrap.classList.add("on");
      startDemo(frame.demo);
    } else {
      appEl.classList.remove("teach");
      demoWrap.classList.remove("on");
      stopDemo();
    }

    var existing = {};
    var kids = actionsEl.querySelectorAll(".btn");
    for (var i = 0; i < kids.length; i++) {
      existing[kids[i].dataset.id] = kids[i];
    }

    var keep = {};
    for (var a = 0; a < frame.actions.length; a++) {
      var action = frame.actions[a];
      keep[action.id] = true;
      actionHandlers[action.id] = action.event;
      var btn = existing[action.id];
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.dataset.id = action.id;
        btn.addEventListener("click", function (ev) {
          var id = ev.currentTarget.dataset.id;
          dispatch(actionHandlers[id]);
        });
      }
      btn.textContent = action.label;
      btn.className = "btn" + (a === 0 ? " primary" : "");
      if (btn.parentNode !== actionsEl || actionsEl.children[a] !== btn) {
        actionsEl.insertBefore(btn, actionsEl.children[a] || null);
      }
    }

    for (var id in existing) {
      if (!keep[id]) existing[id].remove();
    }

    var focusTarget = actionsEl.querySelector('[data-id="' + lastFocusId + '"]') ||
      actionsEl.querySelector(".btn");
    if (focusTarget) {
      focusTarget.focus();
      lastFocusId = focusTarget.dataset.id;
    }
  }

  // --- App loop ---
  var state = null;
  var tickTimer = null;
  var plan = clonePlan("fullbody");

  function resetPlanTo(planId) {
    if (planId && PLANS[planId]) plan = clonePlan(planId);
  }

  function save() {
    if (!state || state.phase === "PlanSelect" || state.phase === "Idle") {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      return;
    }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        state: state,
        planId: state.planId,
        planSetsLen: plan.sets.length
      }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var wrapped = JSON.parse(raw);
      var s = wrapped.state || wrapped;
      if (!s || (s.schemaVersion !== 2 && s.schemaVersion !== 1)) return null;
      if (s.startedAt && now() - s.startedAt > 6 * 60 * 60 * 1000) {
        localStorage.removeItem(STORE_KEY);
        return null;
      }
      var pid = wrapped.planId || s.planId;
      if (!pid || !PLANS[pid]) return null;
      resetPlanTo(pid);
      var baseLen = PLANS[pid].sets.length;
      var extra = (wrapped.planSetsLen || plan.sets.length) - baseLen;
      for (var i = 0; i < extra; i++) {
        plan.sets.push(JSON.parse(JSON.stringify(PLANS[pid].sets[PLANS[pid].sets.length - 1])));
      }
      if (!s.taught) s.taught = [];
      if (s.teachStep == null) s.teachStep = 0;
      s.schemaVersion = 2;
      return s;
    } catch (e) { return null; }
  }

  function paint() {
    var frame = render(state, now(), plan);
    commit(frame);
  }

  function scheduleTick() {
    if (tickTimer) {
      clearTimeout(tickTimer);
      tickTimer = null;
    }
    if (!state || state.phase !== "Resting" || state.restEndsAt == null) return;
    var t = now();
    var delay = Math.max(50, 1000 - (t % 1000));
    tickTimer = setTimeout(function () {
      dispatch({ t: "TICK" });
    }, delay);
  }

  function dispatch(event) {
    if (!event) return;
    var prevPhase = state && state.phase;
    var t = now();

    if (event.t === "SELECT_PLAN") {
      resetPlanTo(event.planId);
      state = freshSession(event.planId, t);
      lastFocusId = "primary";
      save();
      paint();
      scheduleTick();
      return;
    }

    if (!state) {
      state = idleState(t);
    }
    state = reducer(state, event, t, plan);

    // SELECT_PLAN inside reducer also calls resetPlanTo
    if (state.planId && (!plan || plan.id !== state.planId) && PLANS[state.planId]) {
      // keep plan in sync if reducer cloned path skipped
      if (plan.id !== state.planId) resetPlanTo(state.planId);
    }

    if (state.pendingCue === "rest_over") {
      state.pendingCue = null;
      fireCue();
    }

    if (state.phase !== prevPhase) {
      lastFocusId = "primary";
      if (state.phase === "Adjusting") lastFocusId = "minus";
      if (state.phase === "PlanSelect") lastFocusId = "plan_full";
      save();
    } else if (event.t === "ADJUST_DELTA" || event.t === "CONFIRM" || event.t === "TEACH_NEXT") {
      save();
    }

    paint();
    scheduleTick();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      var buttons = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx = buttons.indexOf(document.activeElement);
      var next = buttons[Math.min(buttons.length - 1, Math.max(0, idx) + 1)] || buttons[0];
      if (next) {
        next.focus();
        lastFocusId = next.dataset.id;
      }
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault();
      var buttons2 = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx2 = buttons2.indexOf(document.activeElement);
      var prev = buttons2[Math.max(0, (idx2 < 0 ? 0 : idx2) - 1)] || buttons2[0];
      if (prev) {
        prev.focus();
        lastFocusId = prev.dataset.id;
      }
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      ensureAudio();
      var focused = document.activeElement;
      if (focused && focused.classList.contains("btn")) {
        lastFocusId = focused.dataset.id;
        dispatch(actionHandlers[focused.dataset.id]);
      } else {
        var first = actionsEl.querySelector(".btn");
        if (first) dispatch(actionHandlers[first.dataset.id]);
      }
    }
  });

  document.addEventListener("visibilitychange", function () {
    dispatch({ t: "VISIBILITY", visible: !document.hidden });
  });

  // Boot
  var saved = load();
  if (saved && saved.phase && saved.phase !== "PlanSelect" && saved.phase !== "Idle") {
    state = saved;
    state.paused = document.hidden;
    if (state.phase === "Resting" && state.restEndsAt != null && now() >= state.restEndsAt) {
      dispatch({ t: "VISIBILITY", visible: true });
    } else {
      paint();
      scheduleTick();
    }
  } else {
    state = idleState(now());
    lastFocusId = "plan_full";
    paint();
  }
})();
</script>
</body>
</html>
