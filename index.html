<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>SetPace</title>
<style>
  :root {
    --bg: #000;
    --fg: #ecfeff;
    --accent: #5eead4;
    --accent2: #67e8f9;
    --muted: #94b8bc;
    --card: #071a1c;
    --card-hi: #0c2c30;
    --line: #1a4a50;
    --danger: #fb7185;
    --good: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
  }
  #app {
    width: 600px;
    height: 600px;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 12px;
    position: relative;
  }
  #eyebrow {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    min-height: 20px;
    margin-bottom: 4px;
  }
  #heading {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent2);
    line-height: 1.15;
    min-height: 36px;
  }
  #progress {
    display: none;
    height: 6px;
    background: #0a2226;
    border-radius: 99px;
    margin: 10px 0 6px;
    overflow: hidden;
  }
  #progress.on { display: block; }
  #progress > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.35s ease;
  }
  #demoWrap {
    display: none;
    width: 280px;
    height: 210px;
    margin: 6px auto 4px;
    flex-shrink: 0;
    border-radius: 16px;
    outline: 1px solid var(--line);
    overflow: hidden;
  }
  #demoWrap.on { display: block; }
  #demo {
    width: 280px;
    height: 210px;
    display: block;
    background: #030d0e;
  }
  #hero {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.05;
    margin: 10px 0 6px;
    min-height: 64px;
    color: var(--fg);
    letter-spacing: -0.02em;
  }
  #hero.empty {
    min-height: 0;
    margin: 0;
    font-size: 0;
  }
  #app.teach #hero {
    font-size: 24px;
    font-weight: 700;
    min-height: 30px;
    margin: 4px 0 2px;
    color: var(--fg);
  }
  #app.rest #hero {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #app.summary #heading { color: var(--good); }
  #app.summary #hero { color: var(--good); font-size: 48px; }
  #meta {
    font-size: 18px;
    color: var(--muted);
    min-height: 24px;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  #actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    min-height: 88px;
    width: 100%;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--fg);
    font-size: 26px;
    font-weight: 700;
    border-radius: 16px;
    text-align: left;
    direction: ltr;
    padding: 0 24px;
    outline: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn.primary {
    border-color: var(--accent);
    background: var(--card-hi);
    color: var(--accent2);
  }
  .btn:focus {
    border-color: var(--accent2);
    box-shadow: inset 0 0 0 3px rgba(94, 234, 212, 0.55);
    background: #10383e;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #a5f3fc 0%, #22d3ee 45%, #000 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.12s ease;
  }
  #flash.on { opacity: 0.92; }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: var(--danger);
    padding: 24px;
    font-size: 18px;
    white-space: pre-wrap;
    z-index: 10000;
  }
  .desktop-hint { display: none; }
  @media (min-width: 700px) {
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
    }
    #app { outline: 1px solid #1e293b; border-radius: 8px; }
    .desktop-hint {
      display: block;
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: #64748b;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<pre id="error"></pre>
<div class="desktop-hint">Desktop: arrows + Enter · Glasses: Neural Band</div>
<div id="app">
  <div id="eyebrow"></div>
  <div id="heading"></div>
  <div id="progress"><i id="progressFill"></i></div>
  <div id="demoWrap"><canvas id="demo" width="280" height="210"></canvas></div>
  <div id="hero"></div>
  <div id="meta"></div>
  <div id="actions"></div>
</div>
<script>
(function () {
  "use strict";

  window.onerror = function (msg, src, line, col, err) {
    var el = document.getElementById("error");
    el.style.display = "block";
    el.textContent = String(msg) + "\n" + (src || "") + ":" + line + ":" + col +
      (err && err.stack ? "\n" + err.stack : "");
  };
  window.onunhandledrejection = function (e) {
    window.onerror(String(e.reason && e.reason.message || e.reason), "", 0, 0, e.reason);
  };

  // --- Exercise library (cue ≤28, steps ≤28, name ≤18) ---
  var EX = {
    legpress: {
      id: "legpress", name: "Leg press", unit: "kg",
      cue: "Machine · adjust seat",
      demo: "legpress",
      steps: [
        "Sit · back flat",
        "Feet mid platform",
        "Unlock handles",
        "Press out slow",
        "Bend knees control"
      ]
    },
    chestpress: {
      id: "chestpress", name: "Chest press", unit: "kg",
      cue: "Machine · seat height",
      demo: "chestpress",
      steps: [
        "Sit · back flat",
        "Handles at chest",
        "Grip firm · wrists",
        "Press out slow",
        "Return with control"
      ]
    },
    latpulldown: {
      id: "latpulldown", name: "Lat pulldown", unit: "kg",
      cue: "Cable · high bar",
      demo: "latpulldown",
      steps: [
        "Sit · pin thighs",
        "Wide grip on bar",
        "Chest up slightly",
        "Pull bar to chest",
        "Raise arms slow"
      ]
    },
    shpress: {
      id: "shpress", name: "Shoulder press", unit: "kg",
      cue: "Machine · seat up",
      demo: "shpress",
      steps: [
        "Sit · back supported",
        "Handles at shoulders",
        "Press up slow",
        "Do not lock hard",
        "Lower with control"
      ]
    },
    cablecurl: {
      id: "cablecurl", name: "Cable curl", unit: "kg",
      cue: "Cable · low pulley",
      demo: "cablecurl",
      steps: [
        "Stand · elbows in",
        "Grip bar underhand",
        "Curl to shoulders",
        "Keep elbows still",
        "Lower slow"
      ]
    },
    plank: {
      id: "plank", name: "Plank", unit: "time",
      cue: "Floor · brace hard",
      demo: "plank",
      steps: [
        "Forearms on floor",
        "Body in one line",
        "Brace abs hard",
        "Breathe steady",
        "Hold the time"
      ]
    },
    incline: {
      id: "incline", name: "Incline press", unit: "kg",
      cue: "Machine · slight up",
      demo: "incline",
      steps: [
        "Sit · back on pad",
        "Handles at chest",
        "Press up and out",
        "Stop short of lock",
        "Lower slow"
      ]
    },
    tripush: {
      id: "tripush", name: "Tricep pushdown", unit: "kg",
      cue: "Cable · high pulley",
      demo: "tripush",
      steps: [
        "Stand · elbows pinned",
        "Grip bar / rope",
        "Push down to hips",
        "Squeeze at bottom",
        "Return slow"
      ]
    },
    legcurl: {
      id: "legcurl", name: "Leg curl", unit: "kg",
      cue: "Machine · pad calves",
      demo: "legcurl",
      steps: [
        "Lie or sit set",
        "Pad on lower legs",
        "Curl heels to you",
        "Squeeze hamstrings",
        "Lower slow"
      ]
    },
    legext: {
      id: "legext", name: "Leg extension", unit: "kg",
      cue: "Machine · pad shins",
      demo: "legext",
      steps: [
        "Sit · back flat",
        "Pad on lower shins",
        "Extend knees out",
        "Do not snap lock",
        "Lower control"
      ]
    },
    calfraise: {
      id: "calfraise", name: "Calf raise", unit: "kg",
      cue: "Machine · toes edge",
      demo: "calfraise",
      steps: [
        "Toes on platform",
        "Heels hang free",
        "Rise onto toes",
        "Pause at top",
        "Lower heels slow"
      ]
    },
    bwsquat: {
      id: "bwsquat", name: "BW squat", unit: "bodyweight",
      cue: "Floor · own weight",
      demo: "bwsquat",
      steps: [
        "Feet shoulder wide",
        "Chest up · brace",
        "Sit hips back",
        "Knees track toes",
        "Stand tall"
      ]
    }
  };

  function setsOf(exId, reps, kg, n, rest) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        exerciseId: exId,
        targetReps: reps,
        targetWeightKg: kg,
        restSec: i === n - 1 ? rest.last : rest.mid
      });
    }
    return out;
  }

  var PLANS = {
    fullbody: {
      id: "fullbody",
      name: "Full body",
      exercises: {
        legpress: EX.legpress,
        chestpress: EX.chestpress,
        latpulldown: EX.latpulldown,
        shpress: EX.shpress,
        cablecurl: EX.cablecurl,
        plank: EX.plank
      },
      sets: []
        .concat(setsOf("legpress", 10, 40, 2, { mid: 90, last: 90 }))
        .concat(setsOf("chestpress", 10, 20, 2, { mid: 90, last: 90 }))
        .concat(setsOf("latpulldown", 10, 25, 2, { mid: 75, last: 75 }))
        .concat(setsOf("shpress", 10, 15, 2, { mid: 75, last: 75 }))
        .concat(setsOf("cablecurl", 12, 12, 2, { mid: 60, last: 60 }))
        .concat(setsOf("plank", 30, null, 2, { mid: 45, last: 0 }))
    },
    upper: {
      id: "upper",
      name: "Upper push",
      exercises: {
        chestpress: EX.chestpress,
        shpress: EX.shpress,
        incline: EX.incline,
        tripush: EX.tripush
      },
      sets: []
        .concat(setsOf("chestpress", 10, 25, 3, { mid: 90, last: 90 }))
        .concat(setsOf("shpress", 10, 15, 3, { mid: 90, last: 75 }))
        .concat(setsOf("incline", 10, 20, 3, { mid: 75, last: 75 }))
        .concat(setsOf("tripush", 12, 20, 3, { mid: 60, last: 0 }))
    },
    legs: {
      id: "legs",
      name: "Legs",
      exercises: {
        legpress: EX.legpress,
        legcurl: EX.legcurl,
        legext: EX.legext,
        calfraise: EX.calfraise,
        bwsquat: EX.bwsquat
      },
      sets: []
        .concat(setsOf("legpress", 10, 40, 3, { mid: 90, last: 90 }))
        .concat(setsOf("legcurl", 12, 25, 3, { mid: 75, last: 75 }))
        .concat(setsOf("legext", 12, 25, 3, { mid: 75, last: 75 }))
        .concat(setsOf("calfraise", 15, 30, 3, { mid: 60, last: 60 }))
        .concat(setsOf("bwsquat", 12, null, 2, { mid: 60, last: 0 }))
    }
  };

  var STORE_KEY = "setpace_session_v2";
  var IDEMPOTENCY_MS = 250;
  var STALE_CUE_MS = 30000;

  function now() { return Date.now(); }

  function clonePlan(id) {
    return JSON.parse(JSON.stringify(PLANS[id]));
  }

  function exerciseOf(plan, set) {
    return plan.exercises[set.exerciseId];
  }

  function setProgress(plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return { current: 0, total: 0 };
    var total = 0;
    var current = 0;
    for (var i = 0; i < plan.sets.length; i++) {
      if (plan.sets[i].exerciseId === set.exerciseId) {
        total++;
        if (i <= cursor) current++;
      }
    }
    return { current: current, total: total };
  }

  function formatWeight(kg) {
    if (kg == null) return "";
    return (kg % 1 === 0 ? String(kg) : kg.toFixed(1)) + " kg";
  }

  function formatClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function heroForSet(set, reps, ex) {
    if (ex && ex.unit === "time") return formatClock(reps);
    if (ex && ex.unit === "bodyweight") return reps + " reps";
    var w = formatWeight(set.targetWeightKg);
    return w ? w + " kg · " + reps : reps + " reps";
  }

  function needsTeach(state, plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return false;
    var ex = exerciseOf(plan, set);
    if (!ex || !ex.steps || !ex.steps.length) return false;
    return state.taught.indexOf(ex.id) === -1;
  }

  function markTaught(state, plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return;
    var id = set.exerciseId;
    if (state.taught.indexOf(id) === -1) state.taught.push(id);
  }

  // --- Reducer ---
  function idleState(t) {
    return {
      schemaVersion: 2,
      planId: null,
      startedAt: null,
      cursor: 0,
      logged: [],
      phase: "PlanSelect",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      teachStep: 0,
      taught: [],
      paused: false,
      pendingCue: null
    };
  }

  function freshSession(planId, t) {
    return {
      schemaVersion: 2,
      planId: planId,
      startedAt: t,
      cursor: 0,
      logged: [],
      phase: "Teach",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      teachStep: 0,
      taught: [],
      paused: false,
      pendingCue: null
    };
  }

  function enter(state, phase, t) {
    state.phase = phase;
    state.phaseEnteredAt = t;
    return state;
  }

  function clone(state) {
    return JSON.parse(JSON.stringify(state));
  }

  function withinIdempotency(state, t) {
    return t - state.phaseEnteredAt < IDEMPOTENCY_MS;
  }

  function logSet(state, plan, reps, t, adjusted) {
    var set = plan.sets[state.cursor];
    state.logged.push({
      planIndex: state.cursor,
      actualReps: reps,
      actualWeightKg: set.targetWeightKg,
      completedAt: t,
      restStartedAt: null,
      restEndedAt: null,
      restSkipped: false,
      adjusted: !!adjusted
    });
  }

  function goToCursorReadyOrTeach(state, plan, t) {
    state.setStartedAt = null;
    state.adjust = null;
    state.restEndsAt = null;
    if (needsTeach(state, plan, state.cursor)) {
      state.teachStep = 0;
      return enter(state, "Teach", t);
    }
    return enter(state, "SetReady", t);
  }

  function advanceAfterSet(state, plan, t) {
    var finished = plan.sets[state.cursor];
    state.cursor += 1;
    if (state.cursor >= plan.sets.length) {
      state.restEndsAt = null;
      state.setStartedAt = null;
      state.adjust = null;
      return enter(state, "Summary", t);
    }
    if (!finished.restSec) {
      return goToCursorReadyOrTeach(state, plan, t);
    }
    state.restEndsAt = t + finished.restSec * 1000;
    state.setStartedAt = null;
    state.adjust = null;
    var last = state.logged[state.logged.length - 1];
    last.restStartedAt = t;
    return enter(state, "Resting", t);
  }

  function endRest(state, t, skipped, plan) {
    var last = state.logged[state.logged.length - 1];
    if (last) {
      last.restEndedAt = t;
      last.restSkipped = !!skipped;
    }
    state.restEndsAt = null;
    if (state.cursor >= plan.sets.length) {
      return enter(state, "Summary", t);
    }
    return goToCursorReadyOrTeach(state, plan, t);
  }

  function finishTeach(state, plan, t) {
    markTaught(state, plan, state.cursor);
    state.teachStep = 0;
    return enter(state, "SetReady", t);
  }

  function reducer(state, event, t, plan) {
    state = clone(state);

    if (event.t === "VISIBILITY") {
      state.paused = !event.visible;
      if (event.visible && state.phase === "Resting" && state.restEndsAt != null && t >= state.restEndsAt) {
        var overdue = t - state.restEndsAt;
        state = endRest(state, t, false, plan);
        if (overdue <= STALE_CUE_MS) state.pendingCue = "rest_over";
      }
      return state;
    }

    if (event.t === "TICK") {
      if (state.phase === "Resting" && state.restEndsAt != null && t >= state.restEndsAt) {
        state = endRest(state, t, false, plan);
        state.pendingCue = "rest_over";
      }
      return state;
    }

    if (state.paused && event.t !== "SELECT_PLAN") return state;

    if (event.t === "SELECT_PLAN") {
      if (!PLANS[event.planId]) return state;
      plan = clonePlan(event.planId);
      resetPlanTo(event.planId);
      return freshSession(event.planId, t);
    }

    if (event.t === "TEACH_NEXT") {
      if (state.phase !== "Teach") return state;
      if (withinIdempotency(state, t)) return state;
      var exT = exerciseOf(plan, plan.sets[state.cursor]);
      var steps = (exT && exT.steps) || [];
      if (state.teachStep >= steps.length - 1) {
        return finishTeach(state, plan, t);
      }
      state.teachStep += 1;
      state.phaseEnteredAt = t;
      return state;
    }

    if (event.t === "TEACH_SKIP") {
      if (state.phase !== "Teach") return state;
      if (withinIdempotency(state, t)) return state;
      return finishTeach(state, plan, t);
    }

    if (event.t === "HOW_TO") {
      if (state.phase !== "SetReady") return state;
      state.teachStep = 0;
      return enter(state, "Teach", t);
    }

    if (event.t === "PRIMARY") {
      if (withinIdempotency(state, t)) return state;
      if (state.phase === "SetReady") {
        state.setStartedAt = t;
        state.adjust = null;
        return enter(state, "SetActive", t);
      }
      if (state.phase === "SetActive") {
        var reps = state.adjust ? state.adjust.reps : plan.sets[state.cursor].targetReps;
        var adjusted = !!(state.adjust && state.adjust.reps !== plan.sets[state.cursor].targetReps);
        logSet(state, plan, reps, t, adjusted);
        return advanceAfterSet(state, plan, t);
      }
      if (state.phase === "Resting") {
        return endRest(state, t, true, plan);
      }
      return state;
    }

    if (event.t === "ADJUST") {
      if (state.phase !== "SetReady") return state;
      var cur = plan.sets[state.cursor];
      state.adjust = { reps: cur.targetReps };
      return enter(state, "Adjusting", t);
    }

    if (event.t === "ADJUST_DELTA") {
      if (state.phase !== "Adjusting" || !state.adjust) return state;
      state.adjust.reps = Math.max(1, Math.min(50, state.adjust.reps + event.delta));
      return state;
    }

    if (event.t === "CONFIRM") {
      if (state.phase !== "Adjusting") return state;
      return enter(state, "SetReady", t);
    }

    if (event.t === "UNDO") {
      if (state.phase !== "Resting") return state;
      if (withinIdempotency(state, t)) return state;
      var popped = state.logged.pop();
      if (!popped) return state;
      state.cursor = popped.planIndex;
      state.restEndsAt = null;
      state.setStartedAt = popped.completedAt;
      state.adjust = null;
      return enter(state, "SetActive", t);
    }

    if (event.t === "FINISH") {
      if (state.phase !== "Summary") return state;
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      resetPlanTo(null);
      return idleState(t);
    }

    if (event.t === "ADD_SET") {
      if (state.phase !== "Summary") return state;
      var lastSet = plan.sets[plan.sets.length - 1];
      plan.sets.push(JSON.parse(JSON.stringify(lastSet)));
      state.cursor = plan.sets.length - 1;
      state.adjust = null;
      return goToCursorReadyOrTeach(state, plan, t);
    }

    return state;
  }

  // --- Render ---
  function workoutProgress(state, plan) {
    if (!state || !plan || !plan.sets.length) return 0;
    return Math.min(1, state.logged.length / plan.sets.length);
  }

  function render(state, t, plan) {
    if (!state || state.phase === "PlanSelect" || state.phase === "Idle") {
      return {
        eyebrow: "SetPace",
        heading: "What today?",
        hero: "",
        meta: "Pick a workout",
        demo: null,
        progress: null,
        mood: "home",
        actions: [
          { id: "plan_full", label: "Full body", event: { t: "SELECT_PLAN", planId: "fullbody" } },
          { id: "plan_upper", label: "Upper push", event: { t: "SELECT_PLAN", planId: "upper" } },
          { id: "plan_legs", label: "Legs", event: { t: "SELECT_PLAN", planId: "legs" } }
        ]
      };
    }

    var pct = workoutProgress(state, plan);

    if (state.phase === "Teach") {
      var tset = plan.sets[state.cursor];
      var tex = exerciseOf(plan, tset);
      var steps = tex.steps || [];
      var idx = Math.min(state.teachStep, Math.max(0, steps.length - 1));
      var last = idx >= steps.length - 1;
      return {
        eyebrow: "Learn · " + (idx + 1) + "/" + steps.length,
        heading: tex.name,
        hero: steps[idx] || "",
        meta: tex.cue || "Follow the motion",
        demo: tex.demo || tex.id,
        progress: pct,
        mood: "teach",
        actions: [
          { id: "primary", label: last ? "Let's go" : "Next", event: { t: "TEACH_NEXT" } },
          { id: "skip", label: "I know this", event: { t: "TEACH_SKIP" } }
        ]
      };
    }

    if (state.phase === "Adjusting") {
      var aset = plan.sets[state.cursor];
      var aex = exerciseOf(plan, aset);
      return {
        eyebrow: "Adjust",
        heading: aex.name,
        hero: String(state.adjust.reps) + (aex.unit === "time" ? " sec" : " reps"),
        meta: "Change then confirm",
        demo: null,
        progress: pct,
        mood: "ready",
        actions: [
          { id: "minus", label: "−1", event: { t: "ADJUST_DELTA", delta: -1 } },
          { id: "plus", label: "+1", event: { t: "ADJUST_DELTA", delta: 1 } },
          { id: "done", label: "Save", event: { t: "CONFIRM" } }
        ]
      };
    }

    if (state.phase === "Summary") {
      var volume = 0;
      for (var i = 0; i < state.logged.length; i++) {
        var L = state.logged[i];
        if (L.actualWeightKg != null) volume += L.actualWeightKg * L.actualReps;
      }
      var mins = Math.max(1, Math.round((t - state.startedAt) / 60000));
      return {
        eyebrow: "Nice work",
        heading: "Workout done",
        hero: state.logged.length + " sets",
        meta: mins + " min · " + Math.round(volume) + " kg",
        demo: null,
        progress: 1,
        mood: "summary",
        actions: [
          { id: "primary", label: "Finish", event: { t: "FINISH" } },
          { id: "add", label: "Add set", event: { t: "ADD_SET" } }
        ]
      };
    }

    if (state.phase === "Resting") {
      var remain = Math.max(0, Math.ceil((state.restEndsAt - t) / 1000));
      var next = plan.sets[state.cursor];
      var nex = exerciseOf(plan, next);
      var nprog = setProgress(plan, state.cursor);
      var restMeta = remain <= 10
        ? "Get ready · " + nex.name
        : "Next: " + nex.name + " · " + nprog.current + "/" + nprog.total;
      return {
        eyebrow: remain <= 10 ? "Almost there" : "Rest · breathe",
        heading: nex.name,
        hero: formatClock(remain),
        meta: restMeta,
        demo: null,
        progress: pct,
        mood: "rest",
        actions: [
          { id: "primary", label: "Skip rest", event: { t: "PRIMARY" } },
          { id: "undo", label: "Undo set", event: { t: "UNDO" } }
        ]
      };
    }

    var set = plan.sets[state.cursor];
    var ex = exerciseOf(plan, set);
    var prog = setProgress(plan, state.cursor);
    var reps = state.adjust ? state.adjust.reps : set.targetReps;
    var hero = heroForSet(set, reps, ex);

    if (state.phase === "SetActive") {
      return {
        eyebrow: "Set " + prog.current + "/" + prog.total + " · working",
        heading: ex.name,
        hero: hero,
        meta: "Tap when finished",
        demo: null,
        progress: pct,
        mood: "active",
        actions: [{ id: "primary", label: "Done", event: { t: "PRIMARY" } }]
      };
    }

    return {
      eyebrow: "Set " + prog.current + "/" + prog.total,
      heading: ex.name,
      hero: hero,
      meta: ex.cue || "Ready when you are",
      demo: null,
      progress: pct,
      mood: "ready",
      actions: [
        { id: "primary", label: "Start set", event: { t: "PRIMARY" } },
        { id: "howto", label: "How to?", event: { t: "HOW_TO" } }
      ]
    };
  }

  // --- Canvas demos (one clear motion per exercise) ---
  var demoCanvas = document.getElementById("demo");
  var demoCtx = demoCanvas.getContext("2d");
  var demoRaf = null;
  var demoKind = null;
  var demoStart = 0;

  function stopDemo() {
    if (demoRaf) {
      cancelAnimationFrame(demoRaf);
      demoRaf = null;
    }
    demoKind = null;
  }

  function strokeCyan(ctx, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#00e5ff";
    ctx.fillStyle = "#00e5ff";
    ctx.lineWidth = w || 4;
  }

  function strokeMute(ctx, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#5f8a92";
    ctx.lineWidth = w || 3;
  }

  function strokeHi(ctx, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#e8ffff";
    ctx.lineWidth = w || 3;
  }

  function head(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function line(ctx, x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // 0→1→0 smooth loop
  function wave(p) {
    return 0.5 - 0.5 * Math.cos(Math.PI * 2 * p);
  }

  // Arrow showing motion direction
  function arrow(ctx, x1, y1, x2, y2) {
    strokeHi(ctx, 2);
    line(ctx, x1, y1, x2, y2);
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var s = 8;
    line(ctx, x2, y2, x2 - s * Math.cos(ang - 0.4), y2 - s * Math.sin(ang - 0.4));
    line(ctx, x2, y2, x2 - s * Math.cos(ang + 0.4), y2 - s * Math.sin(ang + 0.4));
  }

  // --- Per-exercise drawings ---

  // Seated, sled/platform moves away with feet (horizontal press)
  function drawLegPress(ctx, p) {
    var a = wave(p);
    var sled = 70 + a * 55;
    strokeMute(ctx, 3);
    line(ctx, 20, 40, 20, 200); // back frame
    line(ctx, 20, 130, 250, 190); // rail
    line(ctx, 20, 150, 100, 200);
    strokeCyan(ctx, 4);
    // reclined body
    head(ctx, 55, 85, 11);
    line(ctx, 55, 96, 90, 130); // torso on pad
    line(ctx, 90, 130, sled, 155); // thighs to platform
    line(ctx, 90, 130, sled - 8, 168);
    strokeHi(ctx, 4);
    line(ctx, sled, 140, sled, 185); // foot plate
    line(ctx, sled - 14, 162, sled + 6, 162);
    arrow(ctx, sled + 10, 120, sled + 40, 120);
  }

  // Seated upright, handles push FORWARD from chest
  function drawChestPress(ctx, p) {
    var a = wave(p);
    var push = a * 42;
    strokeMute(ctx, 3);
    line(ctx, 40, 50, 40, 200);
    line(ctx, 40, 170, 160, 170); // seat
    line(ctx, 40, 70, 40, 150); // back pad
    strokeCyan(ctx, 4);
    head(ctx, 70, 70, 11);
    line(ctx, 70, 81, 70, 130);
    line(ctx, 70, 130, 55, 170);
    line(ctx, 70, 130, 95, 170);
    line(ctx, 70, 100, 115 + push, 95);
    line(ctx, 70, 105, 115 + push, 110);
    strokeHi(ctx, 4);
    line(ctx, 115 + push, 88, 115 + push, 118);
    arrow(ctx, 130 + push, 100, 165 + push * 0.3, 100);
  }

  // Seated under tower, wide bar pulls DOWN to chest
  function drawLatPulldown(ctx, p) {
    var a = wave(p);
    var barY = 45 + a * 55;
    strokeMute(ctx, 3);
    line(ctx, 140, 15, 140, 45); // cable tower
    line(ctx, 60, 200, 220, 200);
    line(ctx, 90, 175, 190, 175); // seat
    line(ctx, 100, 175, 100, 155); // thigh pad posts
    line(ctx, 180, 175, 180, 155);
    strokeCyan(ctx, 4);
    head(ctx, 140, 110, 11);
    line(ctx, 140, 121, 140, 160);
    line(ctx, 140, 160, 115, 175);
    line(ctx, 140, 160, 165, 175);
    line(ctx, 140, 130, 95, barY);
    line(ctx, 140, 130, 185, barY);
    strokeHi(ctx, 4);
    line(ctx, 85, barY, 195, barY);
    strokeMute(ctx, 2);
    line(ctx, 140, 15, 140, barY);
    arrow(ctx, 210, 50, 210, 95);
  }

  // Seated, handles press UP overhead
  function drawShoulderPress(ctx, p) {
    var a = wave(p);
    var up = a * 48;
    strokeMute(ctx, 3);
    line(ctx, 50, 40, 50, 200);
    line(ctx, 50, 175, 170, 175);
    strokeCyan(ctx, 4);
    head(ctx, 95, 95, 11);
    line(ctx, 95, 106, 95, 145);
    line(ctx, 95, 145, 75, 175);
    line(ctx, 95, 145, 120, 175);
    // arms press upward
    var handY = 85 - up;
    line(ctx, 95, 115, 70, handY);
    line(ctx, 95, 115, 120, handY);
    strokeHi(ctx, 4);
    line(ctx, 62, handY, 78, handY);
    line(ctx, 112, handY, 128, handY);
    arrow(ctx, 150, 90, 150, 50);
  }

  // Standing at low cable, curl bar up
  function drawCableCurl(ctx, p) {
    var a = wave(p);
    var bend = a * 1.2;
    strokeMute(ctx, 3);
    line(ctx, 40, 20, 40, 200); // stack
    line(ctx, 40, 195, 90, 195); // low pulley
    strokeCyan(ctx, 4);
    head(ctx, 130, 45, 11);
    line(ctx, 130, 56, 130, 120);
    line(ctx, 130, 120, 110, 175);
    line(ctx, 130, 120, 150, 175);
    var ex = 150, ey = 95;
    line(ctx, 130, 75, ex, ey);
    var hx = ex + Math.cos(-0.3 - bend) * 42;
    var hy = ey + Math.sin(-0.3 - bend) * 42;
    line(ctx, ex, ey, hx, hy);
    strokeHi(ctx, 3);
    line(ctx, hx - 10, hy, hx + 10, hy);
    strokeMute(ctx, 2);
    line(ctx, 90, 195, hx, hy);
    arrow(ctx, 185, 130, 185, 85);
  }

  // Forearm plank hold with breath pulse
  function drawPlank(ctx, p) {
    var pulse = 0.8 + 0.2 * Math.sin(p * Math.PI * 2);
    strokeMute(ctx, 3);
    line(ctx, 30, 170, 250, 170);
    strokeCyan(ctx, 4);
    ctx.globalAlpha = pulse;
    head(ctx, 55, 105, 10);
    line(ctx, 65, 112, 190, 112);
    line(ctx, 75, 112, 70, 155);
    line(ctx, 85, 112, 90, 155);
    line(ctx, 190, 112, 215, 155);
    line(ctx, 190, 112, 200, 155);
    ctx.globalAlpha = 1;
    strokeHi(ctx, 2);
    // "hold" ticks
    line(ctx, 120, 90, 120, 100);
    line(ctx, 140, 88, 140, 100);
    line(ctx, 160, 90, 160, 100);
  }

  // Incline: back pad angled, press up-and-out
  function drawIncline(ctx, p) {
    var a = wave(p);
    var push = a * 38;
    strokeMute(ctx, 3);
    line(ctx, 35, 60, 80, 170); // incline pad
    line(ctx, 80, 170, 180, 170);
    strokeCyan(ctx, 4);
    head(ctx, 70, 75, 11);
    line(ctx, 75, 88, 95, 135); // angled torso
    line(ctx, 95, 135, 80, 170);
    line(ctx, 95, 135, 120, 170);
    var hx = 130 + push * 0.7;
    var hy = 100 - push * 0.55;
    line(ctx, 95, 110, hx, hy);
    line(ctx, 100, 115, hx + 8, hy + 12);
    strokeHi(ctx, 4);
    line(ctx, hx - 4, hy - 6, hx + 12, hy + 16);
    arrow(ctx, 165, 95, 200, 70);
  }

  // Standing, elbows pinned, push cable DOWN to hips (not a pulldown!)
  function drawTriPush(ctx, p) {
    var a = wave(p);
    var down = a * 50;
    strokeMute(ctx, 3);
    line(ctx, 50, 15, 50, 200);
    line(ctx, 50, 30, 140, 30); // high pulley arm
    strokeCyan(ctx, 4);
    head(ctx, 140, 55, 11);
    line(ctx, 140, 66, 140, 130);
    line(ctx, 140, 130, 120, 180);
    line(ctx, 140, 130, 160, 180);
    // upper arms fixed at sides, forearms push down
    var handY = 95 + down;
    line(ctx, 140, 85, 125, 100);
    line(ctx, 140, 85, 155, 100);
    line(ctx, 125, 100, 125, handY);
    line(ctx, 155, 100, 155, handY);
    strokeHi(ctx, 4);
    line(ctx, 115, handY, 165, handY);
    strokeMute(ctx, 2);
    line(ctx, 140, 30, 140, handY);
    arrow(ctx, 185, 110, 185, 155);
  }

  // Lying face-down (or seated side view): heels curl toward glutes
  function drawLegCurl(ctx, p) {
    var a = wave(p);
    var curl = a * 1.1;
    strokeMute(ctx, 3);
    line(ctx, 40, 100, 220, 100); // bench
    line(ctx, 50, 100, 50, 180);
    line(ctx, 210, 100, 210, 180);
    strokeCyan(ctx, 4);
    // torso prone
    head(ctx, 55, 85, 10);
    line(ctx, 65, 90, 140, 90);
    // hip fixed, lower legs curl up
    var kneeX = 155, kneeY = 100;
    line(ctx, 140, 90, kneeX, kneeY);
    var fx = kneeX + Math.cos(0.15 + curl) * 55;
    var fy = kneeY - Math.sin(0.15 + curl) * 55;
    line(ctx, kneeX, kneeY, fx, fy);
    strokeHi(ctx, 4);
    // ankle pad
    line(ctx, fx - 8, fy - 6, fx + 8, fy + 6);
    arrow(ctx, 210, 140, 195, 100);
  }

  // Seated, shin pad extends forward/up as knees straighten
  function drawLegExt(ctx, p) {
    var a = wave(p);
    var ext = a * 1.15;
    strokeMute(ctx, 3);
    line(ctx, 50, 50, 50, 195);
    line(ctx, 50, 160, 140, 160); // seat
    strokeCyan(ctx, 4);
    head(ctx, 85, 70, 11);
    line(ctx, 85, 81, 85, 130);
    line(ctx, 85, 130, 70, 160);
    // thigh on seat, shin swings out
    var kneeX = 130, kneeY = 155;
    line(ctx, 85, 130, kneeX, kneeY);
    var sx = kneeX + Math.cos(-0.2 + ext * 1.3) * 55;
    var sy = kneeY + Math.sin(-0.2 + ext * 1.3) * 55;
    line(ctx, kneeX, kneeY, sx, sy);
    strokeHi(ctx, 4);
    line(ctx, sx - 10, sy - 4, sx + 10, sy + 4); // shin pad
    arrow(ctx, 200, 170, 220, 130);
  }

  // Standing on edge, heels rise (calf)
  function drawCalfRaise(ctx, p) {
    var a = wave(p);
    var lift = a * 28;
    strokeMute(ctx, 3);
    line(ctx, 60, 175, 220, 175); // platform edge
    line(ctx, 60, 175, 60, 200);
    strokeCyan(ctx, 4);
    head(ctx, 140, 40, 11);
    line(ctx, 140, 51, 140, 110);
    // legs shorten visually as heels rise
    line(ctx, 140, 110, 115, 160 - lift);
    line(ctx, 140, 110, 165, 160 - lift);
    strokeHi(ctx, 4);
    // balls of feet on edge, heels up
    line(ctx, 108, 165 - lift, 122, 165 - lift);
    line(ctx, 158, 165 - lift, 172, 165 - lift);
    line(ctx, 115, 165 - lift, 115, 175 - lift * 0.2);
    line(ctx, 165, 165 - lift, 165, 175 - lift * 0.2);
    arrow(ctx, 200, 150, 200, 115);
  }

  // Bodyweight squat: hips sit back, then stand
  function drawBwSquat(ctx, p) {
    var a = wave(p);
    var hipY = 100 + a * 35;
    strokeMute(ctx, 2);
    line(ctx, 50, 200, 230, 200);
    strokeCyan(ctx, 4);
    var headY = 45 + a * 25;
    head(ctx, 140, headY, 11);
    line(ctx, 140, headY + 11, 140 - a * 12, hipY);
    var ky = hipY + 20 + a * 10;
    line(ctx, 140 - a * 12, hipY, 110, ky);
    line(ctx, 140 - a * 12, hipY, 170, ky);
    line(ctx, 110, ky, 105, 195);
    line(ctx, 170, ky, 175, 195);
    arrow(ctx, 210, 80 + a * 40, 210, 130);
  }

  var DEMO_DRAW = {
    legpress: drawLegPress,
    chestpress: drawChestPress,
    latpulldown: drawLatPulldown,
    shpress: drawShoulderPress,
    cablecurl: drawCableCurl,
    plank: drawPlank,
    incline: drawIncline,
    tripush: drawTriPush,
    legcurl: drawLegCurl,
    legext: drawLegExt,
    calfraise: drawCalfRaise,
    bwsquat: drawBwSquat
  };

  function drawDemoFrame(kind, t0) {
    var ctx = demoCtx;
    var w = demoCanvas.width;
    var h = demoCanvas.height;
    ctx.clearRect(0, 0, w, h);
    var elapsed = (t0 - demoStart) / 1000;
    var period = kind === "plank" ? 1.8 : 1.6;
    var p = (elapsed % period) / period;
    var fn = DEMO_DRAW[kind] || drawChestPress;
    fn(ctx, p);
  }

  function startDemo(kind) {
    if (!kind) {
      stopDemo();
      return;
    }
    if (demoKind === kind && demoRaf) return;
    stopDemo();
    demoKind = kind;
    demoStart = performance.now();
    function loop(ts) {
      drawDemoFrame(kind, ts);
      demoRaf = requestAnimationFrame(loop);
    }
    demoRaf = requestAnimationFrame(loop);
  }

  // --- Audio + flash ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      var t0 = ctx.currentTime;
      function chime(freq, at, dur, vol) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.value = 0.0001;
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(vol, at + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.start(at);
        o.stop(at + dur + 0.02);
      }
      chime(523.25, t0, 0.28, 0.16);
      chime(659.25, t0 + 0.14, 0.32, 0.14);
      chime(783.99, t0 + 0.28, 0.45, 0.12);
    } catch (e) {}
  }

  function flashPulse() {
    var el = document.getElementById("flash");
    var n = 0;
    function beat() {
      el.classList.add("on");
      setTimeout(function () {
        el.classList.remove("on");
        n++;
        if (n < 2) setTimeout(beat, 160);
      }, 220);
    }
    beat();
  }

  function fireCue() {
    playTone();
    flashPulse();
  }

  // --- DOM commit ---
  var appEl = document.getElementById("app");
  var eyebrowEl = document.getElementById("eyebrow");
  var headingEl = document.getElementById("heading");
  var heroEl = document.getElementById("hero");
  var metaEl = document.getElementById("meta");
  var demoWrap = document.getElementById("demoWrap");
  var progressEl = document.getElementById("progress");
  var progressFill = document.getElementById("progressFill");
  var actionsEl = document.getElementById("actions");
  var lastFocusId = "primary";
  var actionHandlers = {};
  var moodClasses = ["teach", "rest", "summary", "active", "ready", "home"];

  function commit(frame) {
    eyebrowEl.textContent = frame.eyebrow || "";
    headingEl.textContent = frame.heading || "";
    heroEl.textContent = frame.hero || "";
    if (!frame.hero) heroEl.classList.add("empty");
    else heroEl.classList.remove("empty");
    metaEl.textContent = frame.meta || "";

    for (var m = 0; m < moodClasses.length; m++) {
      appEl.classList.remove(moodClasses[m]);
    }
    if (frame.mood) appEl.classList.add(frame.mood);

    if (frame.progress == null) {
      progressEl.classList.remove("on");
    } else {
      progressEl.classList.add("on");
      progressFill.style.width = Math.round(frame.progress * 100) + "%";
    }

    if (frame.demo) {
      demoWrap.classList.add("on");
      startDemo(frame.demo);
    } else {
      demoWrap.classList.remove("on");
      stopDemo();
    }

    var existing = {};
    var kids = actionsEl.querySelectorAll(".btn");
    for (var i = 0; i < kids.length; i++) {
      existing[kids[i].dataset.id] = kids[i];
    }

    var keep = {};
    for (var a = 0; a < frame.actions.length; a++) {
      var action = frame.actions[a];
      keep[action.id] = true;
      actionHandlers[action.id] = action.event;
      var btn = existing[action.id];
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.dataset.id = action.id;
        btn.addEventListener("click", function (ev) {
          var id = ev.currentTarget.dataset.id;
          dispatch(actionHandlers[id]);
        });
      }
      btn.textContent = action.label;
      btn.className = "btn" + (a === 0 ? " primary" : "");
      if (btn.parentNode !== actionsEl || actionsEl.children[a] !== btn) {
        actionsEl.insertBefore(btn, actionsEl.children[a] || null);
      }
    }

    for (var id in existing) {
      if (!keep[id]) existing[id].remove();
    }

    var focusTarget = actionsEl.querySelector('[data-id="' + lastFocusId + '"]') ||
      actionsEl.querySelector(".btn");
    if (focusTarget) {
      focusTarget.focus();
      lastFocusId = focusTarget.dataset.id;
    }
  }

  // --- App loop ---
  var state = null;
  var tickTimer = null;
  var plan = clonePlan("fullbody");

  function resetPlanTo(planId) {
    if (planId && PLANS[planId]) plan = clonePlan(planId);
  }

  function save() {
    if (!state || state.phase === "PlanSelect" || state.phase === "Idle") {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      return;
    }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        state: state,
        planId: state.planId,
        planSetsLen: plan.sets.length
      }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var wrapped = JSON.parse(raw);
      var s = wrapped.state || wrapped;
      if (!s || (s.schemaVersion !== 2 && s.schemaVersion !== 1)) return null;
      if (s.startedAt && now() - s.startedAt > 6 * 60 * 60 * 1000) {
        localStorage.removeItem(STORE_KEY);
        return null;
      }
      var pid = wrapped.planId || s.planId;
      if (!pid || !PLANS[pid]) return null;
      resetPlanTo(pid);
      var baseLen = PLANS[pid].sets.length;
      var extra = (wrapped.planSetsLen || plan.sets.length) - baseLen;
      for (var i = 0; i < extra; i++) {
        plan.sets.push(JSON.parse(JSON.stringify(PLANS[pid].sets[PLANS[pid].sets.length - 1])));
      }
      if (!s.taught) s.taught = [];
      if (s.teachStep == null) s.teachStep = 0;
      s.schemaVersion = 2;
      return s;
    } catch (e) { return null; }
  }

  function paint() {
    var frame = render(state, now(), plan);
    commit(frame);
  }

  function scheduleTick() {
    if (tickTimer) {
      clearTimeout(tickTimer);
      tickTimer = null;
    }
    if (!state || state.phase !== "Resting" || state.restEndsAt == null) return;
    var t = now();
    var delay = Math.max(50, 1000 - (t % 1000));
    tickTimer = setTimeout(function () {
      dispatch({ t: "TICK" });
    }, delay);
  }

  function dispatch(event) {
    if (!event) return;
    var prevPhase = state && state.phase;
    var t = now();

    if (event.t === "SELECT_PLAN") {
      resetPlanTo(event.planId);
      state = freshSession(event.planId, t);
      lastFocusId = "primary";
      save();
      paint();
      scheduleTick();
      return;
    }

    if (!state) {
      state = idleState(t);
    }
    state = reducer(state, event, t, plan);

    // SELECT_PLAN inside reducer also calls resetPlanTo
    if (state.planId && (!plan || plan.id !== state.planId) && PLANS[state.planId]) {
      // keep plan in sync if reducer cloned path skipped
      if (plan.id !== state.planId) resetPlanTo(state.planId);
    }

    if (state.pendingCue === "rest_over") {
      state.pendingCue = null;
      fireCue();
    }

    if (state.phase !== prevPhase) {
      lastFocusId = "primary";
      if (state.phase === "Adjusting") lastFocusId = "minus";
      if (state.phase === "PlanSelect") lastFocusId = "plan_full";
      save();
    } else if (event.t === "ADJUST_DELTA" || event.t === "CONFIRM" || event.t === "TEACH_NEXT") {
      save();
    }

    paint();
    scheduleTick();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      var buttons = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx = buttons.indexOf(document.activeElement);
      var next = buttons[Math.min(buttons.length - 1, Math.max(0, idx) + 1)] || buttons[0];
      if (next) {
        next.focus();
        lastFocusId = next.dataset.id;
      }
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault();
      var buttons2 = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx2 = buttons2.indexOf(document.activeElement);
      var prev = buttons2[Math.max(0, (idx2 < 0 ? 0 : idx2) - 1)] || buttons2[0];
      if (prev) {
        prev.focus();
        lastFocusId = prev.dataset.id;
      }
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      ensureAudio();
      var focused = document.activeElement;
      if (focused && focused.classList.contains("btn")) {
        lastFocusId = focused.dataset.id;
        dispatch(actionHandlers[focused.dataset.id]);
      } else {
        var first = actionsEl.querySelector(".btn");
        if (first) dispatch(actionHandlers[first.dataset.id]);
      }
    }
  });

  document.addEventListener("visibilitychange", function () {
    dispatch({ t: "VISIBILITY", visible: !document.hidden });
  });

  // Boot
  var saved = load();
  if (saved && saved.phase && saved.phase !== "PlanSelect" && saved.phase !== "Idle") {
    state = saved;
    state.paused = document.hidden;
    if (state.phase === "Resting" && state.restEndsAt != null && now() >= state.restEndsAt) {
      dispatch({ t: "VISIBILITY", visible: true });
    } else {
      paint();
      scheduleTick();
    }
  } else {
    state = idleState(now());
    lastFocusId = "plan_full";
    paint();
  }
})();
</script>
</body>
</html>
