<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>SetPace</title>
<style>
  :root {
    --bg: #000;
    --fg: #e8ffff;
    --accent: #00e5ff;
    --muted: #7aa8b0;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #app {
    width: 600px;
    height: 600px;
    display: flex;
    flex-direction: column;
    padding: 16px 20px 12px;
  }
  #heading {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.15;
    min-height: 36px;
    letter-spacing: 0.02em;
  }
  #hero {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    margin: 18px 0 8px;
    min-height: 80px;
    color: var(--fg);
  }
  #meta {
    font-size: 20px;
    color: var(--muted);
    min-height: 28px;
    margin-bottom: 12px;
  }
  #actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    min-height: 88px;
    width: 100%;
    border: 2px solid #133a40;
    background: #061416;
    color: var(--fg);
    font-size: 26px;
    font-weight: 700;
    border-radius: 8px;
    text-align: left;
    padding: 0 22px;
    outline: none;
  }
  .btn.primary {
    border-color: var(--accent);
    background: #062228;
    color: var(--accent);
  }
  .btn:focus {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--accent);
    background: #0a3038;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
  }
  #flash.on { opacity: 1; }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: var(--danger);
    padding: 24px;
    font-size: 18px;
    white-space: pre-wrap;
    z-index: 10000;
  }
  .desktop-hint {
    display: none;
  }
  @media (min-width: 700px) {
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    #app {
      outline: 1px solid #333;
    }
    .desktop-hint {
      display: block;
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: #666;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<pre id="error"></pre>
<div class="desktop-hint">Desktop: arrows + Enter. Glasses: Neural Band / captouch.</div>
<div id="app">
  <div id="heading"></div>
  <div id="hero"></div>
  <div id="meta"></div>
  <div id="actions"></div>
</div>
<script>
(function () {
  "use strict";

  window.onerror = function (msg, src, line, col, err) {
    var el = document.getElementById("error");
    el.style.display = "block";
    el.textContent = String(msg) + "\n" + (src || "") + ":" + line + ":" + col +
      (err && err.stack ? "\n" + err.stack : "");
  };
  window.onunhandledrejection = function (e) {
    window.onerror(String(e.reason && e.reason.message || e.reason), "", 0, 0, e.reason);
  };

  // --- Plan (hardcoded v1) ---
  var PLAN = {
    id: "push-a",
    name: "Push A",
    exercises: {
      bench: { id: "bench", name: "Bench Press", unit: "kg" },
      ohp: { id: "ohp", name: "OH Press", unit: "kg" },
      incline: { id: "incline", name: "Incline DB", unit: "kg" },
      tri: { id: "tri", name: "Tri Pushdown", unit: "kg" }
    },
    sets: [
      { exerciseId: "bench", targetReps: 8, targetWeightKg: 60, restSec: 90 },
      { exerciseId: "bench", targetReps: 8, targetWeightKg: 60, restSec: 90 },
      { exerciseId: "bench", targetReps: 8, targetWeightKg: 60, restSec: 90 },
      { exerciseId: "ohp", targetReps: 8, targetWeightKg: 35, restSec: 90 },
      { exerciseId: "ohp", targetReps: 8, targetWeightKg: 35, restSec: 90 },
      { exerciseId: "ohp", targetReps: 8, targetWeightKg: 35, restSec: 75 },
      { exerciseId: "incline", targetReps: 10, targetWeightKg: 22.5, restSec: 75 },
      { exerciseId: "incline", targetReps: 10, targetWeightKg: 22.5, restSec: 75 },
      { exerciseId: "incline", targetReps: 10, targetWeightKg: 22.5, restSec: 60 },
      { exerciseId: "tri", targetReps: 12, targetWeightKg: 25, restSec: 60 },
      { exerciseId: "tri", targetReps: 12, targetWeightKg: 25, restSec: 60 },
      { exerciseId: "tri", targetReps: 12, targetWeightKg: 25, restSec: 0 }
    ]
  };

  var STORE_KEY = "setpace_session_v1";
  var IDEMPOTENCY_MS = 250;
  var STALE_CUE_MS = 30000;

  function now() { return Date.now(); }

  function exerciseOf(plan, set) {
    return plan.exercises[set.exerciseId];
  }

  function setProgress(plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return { current: 0, total: 0 };
    var total = 0;
    var current = 0;
    for (var i = 0; i < plan.sets.length; i++) {
      if (plan.sets[i].exerciseId === set.exerciseId) {
        total++;
        if (i <= cursor) current++;
      }
    }
    return { current: current, total: total };
  }

  function formatWeight(kg) {
    if (kg == null) return "";
    return (kg % 1 === 0 ? String(kg) : kg.toFixed(1)) + " kg";
  }

  function formatClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function heroLine(set) {
    var w = formatWeight(set.targetWeightKg);
    if (w) return w + " x " + set.targetReps;
    return "x " + set.targetReps;
  }

  // --- Reducer ---
  function freshSession(planId, t) {
    return {
      schemaVersion: 1,
      planId: planId,
      startedAt: t,
      cursor: 0,
      logged: [],
      phase: "SetReady",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      paused: false,
      pendingCue: null
    };
  }

  function enter(state, phase, t) {
    state.phase = phase;
    state.phaseEnteredAt = t;
    return state;
  }

  function clone(state) {
    return JSON.parse(JSON.stringify(state));
  }

  function withinIdempotency(state, t) {
    return t - state.phaseEnteredAt < IDEMPOTENCY_MS;
  }

  function logSet(state, plan, reps, t, adjusted) {
    var set = plan.sets[state.cursor];
    state.logged.push({
      planIndex: state.cursor,
      actualReps: reps,
      actualWeightKg: set.targetWeightKg,
      completedAt: t,
      restStartedAt: null,
      restEndedAt: null,
      restSkipped: false,
      adjusted: !!adjusted
    });
  }

  function advanceAfterSet(state, plan, t) {
    var finished = plan.sets[state.cursor];
    state.cursor += 1;
    if (state.cursor >= plan.sets.length) {
      state.restEndsAt = null;
      state.setStartedAt = null;
      state.adjust = null;
      return enter(state, "Summary", t);
    }
    if (!finished.restSec) {
      state.restEndsAt = null;
      state.setStartedAt = null;
      state.adjust = null;
      return enter(state, "SetReady", t);
    }
    state.restEndsAt = t + finished.restSec * 1000;
    state.setStartedAt = null;
    state.adjust = null;
    var last = state.logged[state.logged.length - 1];
    last.restStartedAt = t;
    return enter(state, "Resting", t);
  }

  function endRest(state, t, skipped, planLen) {
    var last = state.logged[state.logged.length - 1];
    if (last) {
      last.restEndedAt = t;
      last.restSkipped = !!skipped;
    }
    state.restEndsAt = null;
    if (state.cursor >= planLen) {
      return enter(state, "Summary", t);
    }
    return enter(state, "SetReady", t);
  }

  function reducer(state, event, t, plan) {
    state = clone(state);

    if (event.t === "VISIBILITY") {
      state.paused = !event.visible;
      if (event.visible && state.phase === "Resting" && state.restEndsAt != null && t >= state.restEndsAt) {
        var overdue = t - state.restEndsAt;
        state = endRest(state, t, false, plan.sets.length);
        if (overdue <= STALE_CUE_MS) state.pendingCue = "rest_over";
      }
      return state;
    }

    if (event.t === "TICK") {
      if (state.phase === "Resting" && state.restEndsAt != null && t >= state.restEndsAt) {
        state = endRest(state, t, false, plan.sets.length);
        state.pendingCue = "rest_over";
      }
      return state;
    }

    if (state.paused && event.t !== "OPEN") return state;

    if (event.t === "OPEN") {
      resetPlan();
      return freshSession(PLAN.id, t);
    }

    if (event.t === "PRIMARY") {
      if (withinIdempotency(state, t)) return state;
      if (state.phase === "SetReady") {
        state.setStartedAt = t;
        state.adjust = null;
        return enter(state, "SetActive", t);
      }
      if (state.phase === "SetActive") {
        var reps = state.adjust ? state.adjust.reps : plan.sets[state.cursor].targetReps;
        var adjusted = !!(state.adjust && state.adjust.reps !== plan.sets[state.cursor].targetReps);
        logSet(state, plan, reps, t, adjusted);
        return advanceAfterSet(state, plan, t);
      }
      if (state.phase === "Resting") {
        state = endRest(state, t, true, plan.sets.length);
        return state;
      }
      return state;
    }

    if (event.t === "ADJUST") {
      if (state.phase !== "SetReady") return state;
      var cur = plan.sets[state.cursor];
      state.adjust = { reps: cur.targetReps };
      return enter(state, "Adjusting", t);
    }

    if (event.t === "ADJUST_DELTA") {
      if (state.phase !== "Adjusting" || !state.adjust) return state;
      state.adjust.reps = Math.max(1, Math.min(50, state.adjust.reps + event.delta));
      return state;
    }

    if (event.t === "CONFIRM") {
      if (state.phase !== "Adjusting") return state;
      return enter(state, "SetReady", t);
    }

    if (event.t === "UNDO") {
      if (state.phase !== "Resting") return state;
      if (withinIdempotency(state, t)) return state;
      var popped = state.logged.pop();
      if (!popped) return state;
      state.cursor = popped.planIndex;
      state.restEndsAt = null;
      state.setStartedAt = popped.completedAt;
      state.adjust = null;
      return enter(state, "SetActive", t);
    }

    if (event.t === "FINISH") {
      if (state.phase !== "Summary") return state;
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      return { phase: "Idle", schemaVersion: 1, planId: null, startedAt: null, cursor: 0, logged: [], phaseEnteredAt: t, setStartedAt: null, restEndsAt: null, adjust: null, paused: false, pendingCue: null };
    }

    if (event.t === "ADD_SET") {
      if (state.phase !== "Summary") return state;
      // session-local overlay: append copy of last planned set
      var lastSet = plan.sets[plan.sets.length - 1];
      plan.sets.push(JSON.parse(JSON.stringify(lastSet)));
      state.cursor = plan.sets.length - 1;
      state.adjust = null;
      return enter(state, "SetReady", t);
    }

    return state;
  }

  // --- Render to Frame ---
  function render(state, t, plan) {
    if (!state || state.phase === "Idle") {
      return {
        heading: "SetPace",
        hero: "Push A",
        meta: plan.sets.length + " sets",
        actions: [{ id: "primary", label: "Start", event: { t: "OPEN" } }]
      };
    }

    if (state.phase === "Adjusting") {
      var aset = plan.sets[state.cursor];
      var aex = exerciseOf(plan, aset);
      return {
        heading: aex.name,
        hero: String(state.adjust.reps) + " reps",
        meta: "Adjust reps",
        actions: [
          { id: "minus", label: "−1", event: { t: "ADJUST_DELTA", delta: -1 } },
          { id: "plus", label: "+1", event: { t: "ADJUST_DELTA", delta: 1 } },
          { id: "done", label: "Done", event: { t: "CONFIRM" } }
        ]
      };
    }

    if (state.phase === "Summary") {
      var volume = 0;
      for (var i = 0; i < state.logged.length; i++) {
        var L = state.logged[i];
        if (L.actualWeightKg != null) volume += L.actualWeightKg * L.actualReps;
      }
      var mins = Math.round((t - state.startedAt) / 60000);
      return {
        heading: "Done",
        hero: String(state.logged.length) + " sets",
        meta: mins + " min · " + Math.round(volume) + " kg",
        actions: [
          { id: "primary", label: "Finish", event: { t: "FINISH" } },
          { id: "add", label: "Add set", event: { t: "ADD_SET" } }
        ]
      };
    }

    if (state.phase === "Resting") {
      var remain = Math.max(0, Math.ceil((state.restEndsAt - t) / 1000));
      var next = plan.sets[state.cursor];
      var nex = exerciseOf(plan, next);
      var nprog = setProgress(plan, state.cursor);
      return {
        heading: "Rest",
        hero: formatClock(remain),
        meta: "Next: " + nex.name + " " + nprog.current + "/" + nprog.total,
        actions: [
          { id: "primary", label: "Skip rest", event: { t: "PRIMARY" } },
          { id: "undo", label: "Undo set", event: { t: "UNDO" } }
        ]
      };
    }

    var set = plan.sets[state.cursor];
    var ex = exerciseOf(plan, set);
    var prog = setProgress(plan, state.cursor);
    var reps = state.adjust ? state.adjust.reps : set.targetReps;
    var hero = formatWeight(set.targetWeightKg);
    hero = hero ? hero + " x " + reps : "x " + reps;

    if (state.phase === "SetActive") {
      return {
        heading: ex.name,
        hero: hero,
        meta: "Set " + prog.current + "/" + prog.total + " · lifting",
        actions: [{ id: "primary", label: "Done", event: { t: "PRIMARY" } }]
      };
    }

    // SetReady
    return {
      heading: ex.name,
      hero: hero,
      meta: "Set " + prog.current + "/" + prog.total,
      actions: [
        { id: "primary", label: "Start set", event: { t: "PRIMARY" } },
        { id: "adjust", label: "Adjust", event: { t: "ADJUST" } }
      ]
    };
  }

  // --- Audio + flash ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "square";
      o.frequency.value = 880;
      g.gain.value = 0.0001;
      o.connect(g);
      g.connect(ctx.destination);
      var t0 = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.start(t0);
      o.stop(t0 + 0.4);
      setTimeout(function () {
        try {
          var o2 = ctx.createOscillator();
          var g2 = ctx.createGain();
          o2.type = "square";
          o2.frequency.value = 1175;
          g2.gain.value = 0.0001;
          o2.connect(g2);
          g2.connect(ctx.destination);
          var t1 = ctx.currentTime;
          g2.gain.setValueAtTime(0.0001, t1);
          g2.gain.exponentialRampToValueAtTime(0.18, t1 + 0.02);
          g2.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.28);
          o2.start(t1);
          o2.stop(t1 + 0.32);
        } catch (e2) {}
      }, 180);
    } catch (e) {}
  }

  function flashPulse() {
    var el = document.getElementById("flash");
    var n = 0;
    function beat() {
      el.classList.add("on");
      setTimeout(function () {
        el.classList.remove("on");
        n++;
        if (n < 3) setTimeout(beat, 120);
      }, 180);
    }
    beat();
  }

  function fireCue() {
    playTone();
    flashPulse();
  }

  // --- DOM commit (keyed) ---
  var headingEl = document.getElementById("heading");
  var heroEl = document.getElementById("hero");
  var metaEl = document.getElementById("meta");
  var actionsEl = document.getElementById("actions");
  var lastFocusId = "primary";
  var actionHandlers = {};

  function commit(frame) {
    headingEl.textContent = frame.heading || "";
    heroEl.textContent = frame.hero || "";
    metaEl.textContent = frame.meta || "";

    var existing = {};
    var kids = actionsEl.querySelectorAll(".btn");
    for (var i = 0; i < kids.length; i++) {
      existing[kids[i].dataset.id] = kids[i];
    }

    var keep = {};
    var order = [];
    for (var a = 0; a < frame.actions.length; a++) {
      var action = frame.actions[a];
      keep[action.id] = true;
      order.push(action);
      actionHandlers[action.id] = action.event;
      var btn = existing[action.id];
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.dataset.id = action.id;
        btn.addEventListener("click", function (ev) {
          var id = ev.currentTarget.dataset.id;
          dispatch(actionHandlers[id]);
        });
      }
      btn.textContent = action.label;
      btn.className = "btn" + (a === 0 ? " primary" : "");
      if (btn.parentNode !== actionsEl || actionsEl.children[a] !== btn) {
        actionsEl.insertBefore(btn, actionsEl.children[a] || null);
      }
    }

    for (var id in existing) {
      if (!keep[id]) existing[id].remove();
    }

    var focusTarget = actionsEl.querySelector('[data-id="' + lastFocusId + '"]') ||
      actionsEl.querySelector(".btn");
    if (focusTarget) {
      focusTarget.focus();
      lastFocusId = focusTarget.dataset.id;
    }
  }

  // --- App loop ---
  var state = null;
  var tickTimer = null;
  var plan = JSON.parse(JSON.stringify(PLAN));

  function resetPlan() {
    plan = JSON.parse(JSON.stringify(PLAN));
  }

  function save() {
    if (!state || state.phase === "Idle") {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      return;
    }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ state: state, planSetsLen: plan.sets.length }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var wrapped = JSON.parse(raw);
      var s = wrapped.state || wrapped;
      if (!s || s.schemaVersion !== 1) return null;
      if (s.startedAt && now() - s.startedAt > 6 * 60 * 60 * 1000) {
        localStorage.removeItem(STORE_KEY);
        return null;
      }
      resetPlan();
      var extra = (wrapped.planSetsLen || plan.sets.length) - PLAN.sets.length;
      for (var i = 0; i < extra; i++) {
        plan.sets.push(JSON.parse(JSON.stringify(PLAN.sets[PLAN.sets.length - 1])));
      }
      return s;
    } catch (e) { return null; }
  }

  function paint() {
    var frame = render(state, now(), plan);
    commit(frame);
  }

  function scheduleTick() {
    if (tickTimer) {
      clearTimeout(tickTimer);
      tickTimer = null;
    }
    if (!state || state.phase !== "Resting" || state.restEndsAt == null) return;
    var t = now();
    var delay = Math.max(50, 1000 - (t % 1000));
    tickTimer = setTimeout(function () {
      dispatch({ t: "TICK" });
    }, delay);
  }

  function dispatch(event) {
    if (!event) return;
    var prevPhase = state && state.phase;
    var t = now();
    if (!state) {
      if (event.t === "OPEN") {
        state = freshSession(plan.id, t);
      } else {
        state = { phase: "Idle", schemaVersion: 1, planId: null, startedAt: null, cursor: 0, logged: [], phaseEnteredAt: t, setStartedAt: null, restEndsAt: null, adjust: null, paused: false, pendingCue: null };
        state = reducer(state, event, t, plan);
      }
    } else {
      state = reducer(state, event, t, plan);
    }

    if (state.pendingCue === "rest_over") {
      state.pendingCue = null;
      fireCue();
    }

    if (state.phase !== prevPhase) {
      lastFocusId = "primary";
      if (state.phase === "Adjusting") lastFocusId = "minus";
      save();
    } else if (event.t === "ADJUST_DELTA" || event.t === "CONFIRM") {
      save();
    }

    paint();
    scheduleTick();
  }

  // Input: arrows move focus only; Enter dispatches
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      var buttons = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx = buttons.indexOf(document.activeElement);
      var next = buttons[Math.min(buttons.length - 1, Math.max(0, idx) + 1)] || buttons[0];
      if (next) {
        next.focus();
        lastFocusId = next.dataset.id;
      }
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault();
      var buttons2 = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx2 = buttons2.indexOf(document.activeElement);
      var prev = buttons2[Math.max(0, (idx2 < 0 ? 0 : idx2) - 1)] || buttons2[0];
      if (prev) {
        prev.focus();
        lastFocusId = prev.dataset.id;
      }
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      ensureAudio();
      var focused = document.activeElement;
      if (focused && focused.classList.contains("btn")) {
        lastFocusId = focused.dataset.id;
        dispatch(actionHandlers[focused.dataset.id]);
      } else {
        dispatch(actionHandlers.primary || (state && state.phase === "Idle" ? { t: "OPEN" } : null));
      }
    }
  });

  document.addEventListener("visibilitychange", function () {
    dispatch({ t: "VISIBILITY", visible: !document.hidden });
  });

  // Boot
  var saved = load();
  if (saved && saved.phase && saved.phase !== "Idle") {
    state = saved;
    state.paused = document.hidden;
    // If rest already ended while away, cue on next paint path via VISIBILITY
    if (state.phase === "Resting" && state.restEndsAt != null && now() >= state.restEndsAt) {
      dispatch({ t: "VISIBILITY", visible: true });
    } else {
      paint();
      scheduleTick();
    }
  } else {
    state = { phase: "Idle", schemaVersion: 1, planId: null, startedAt: null, cursor: 0, logged: [], phaseEnteredAt: now(), setStartedAt: null, restEndsAt: null, adjust: null, paused: false, pendingCue: null };
    paint();
  }
})();
</script>
