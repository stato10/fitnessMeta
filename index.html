<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>SetPace</title>
<style>
  :root {
    --bg: #000;
    --fg: #ecfeff;
    --accent: #5eead4;
    --accent2: #67e8f9;
    --muted: #94b8bc;
    --card: #071a1c;
    --card-hi: #0c2c30;
    --line: #1a4a50;
    --danger: #fb7185;
    --good: #86efac;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 600px;
    height: 600px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
  }
  #app {
    width: 600px;
    height: 600px;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 12px;
    position: relative;
  }
  #eyebrow {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    min-height: 20px;
    margin-bottom: 4px;
  }
  #heading {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent2);
    line-height: 1.15;
    min-height: 36px;
  }
  #progress {
    display: none;
    height: 6px;
    background: #0a2226;
    border-radius: 99px;
    margin: 10px 0 6px;
    overflow: hidden;
  }
  #progress.on { display: block; }
  #progress > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.35s ease;
  }
  #demoWrap {
    display: none;
    width: 280px;
    height: 210px;
    margin: 6px auto 2px;
    flex-shrink: 0;
    border-radius: 16px;
    outline: 1px solid var(--line);
    overflow: hidden;
    position: relative;
    background: #030d0e;
  }
  #demoWrap.on { display: block; }
  #demo {
    width: 280px;
    height: 210px;
    display: block;
    background: #030d0e;
  }
  #demo.off { display: none; }
  #demoGif {
    display: none;
    width: 280px;
    height: 210px;
    object-fit: contain;
    background: #030d0e;
  }
  #demoGif.on { display: block; }
  #demoCredit {
    display: none;
    text-align: center;
    font-size: 12px;
    color: #5a7a7e;
    margin: 0 0 2px;
    min-height: 0;
  }
  #demoCredit.on { display: block; }
  #hero {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.05;
    margin: 10px 0 6px;
    min-height: 64px;
    color: var(--fg);
    letter-spacing: -0.02em;
  }
  #hero.empty {
    min-height: 0;
    margin: 0;
    font-size: 0;
  }
  #app.teach #hero {
    font-size: 24px;
    font-weight: 700;
    min-height: 30px;
    margin: 4px 0 2px;
    color: var(--fg);
  }
  #app.rest #hero {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #app.summary #heading { color: var(--good); }
  #app.summary #hero { color: var(--good); font-size: 48px; }
  #meta {
    font-size: 18px;
    color: var(--muted);
    min-height: 24px;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  #actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    min-height: 88px;
    width: 100%;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--fg);
    font-size: 26px;
    font-weight: 700;
    border-radius: 16px;
    text-align: left;
    direction: ltr;
    padding: 0 24px;
    outline: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn.primary {
    border-color: var(--accent);
    background: var(--card-hi);
    color: var(--accent2);
  }
  .btn:focus {
    border-color: var(--accent2);
    box-shadow: inset 0 0 0 3px rgba(94, 234, 212, 0.55);
    background: #10383e;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, #a5f3fc 0%, #22d3ee 45%, #000 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.12s ease;
  }
  #flash.on { opacity: 0.92; }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: var(--danger);
    padding: 24px;
    font-size: 18px;
    white-space: pre-wrap;
    z-index: 10000;
  }
  .desktop-hint { display: none; }
  @media (min-width: 700px) {
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
    }
    #app { outline: 1px solid #1e293b; border-radius: 8px; }
    .desktop-hint {
      display: block;
      position: fixed;
      bottom: 12px;
      left: 12px;
      color: #64748b;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<pre id="error"></pre>

  <div id="eyebrow"></div>
  <div id="heading"></div>
  <div id="progress"><i id="progressFill"></i></div>
  <div id="demoWrap">
    <canvas id="demo" width="280" height="210"></canvas>

  </div>
  <div id="demoCredit"></div>
  <div id="hero"></div>
  <div id="meta"></div>
  <div id="actions"></div>
</div>

  function setsOf(exId, reps, kg, n, rest) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        exerciseId: exId,
        targetReps: reps,
        targetWeightKg: kg,
        restSec: i === n - 1 ? rest.last : rest.mid
      });
    }
    return out;
  }

  var PLANS = {

  var STORE_KEY = "setpace_session_v2";

  var PRE_WORKOUT = {

    EquipSelect: 1, MachineList: 1, MachineDetail: 1
  };

  function now() { return Date.now(); }

  function loadTaughtEver() {
    try {
      var raw = localStorage.getItem(TAUGHT_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function persistTaught(id) {
    if (!id) return;
    var arr = loadTaughtEver();
    if (arr.indexOf(id) === -1) {
      arr.push(id);
      try { localStorage.setItem(TAUGHT_KEY, JSON.stringify(arr)); } catch (e) {}
    }
  }

  function scalePlanWeights(plan, level) {
    var mult = LEVEL_MULT[level] || 1;
    if (mult === 1) return plan;
    for (var i = 0; i < plan.sets.length; i++) {
      var kg = plan.sets[i].targetWeightKg;
      if (kg == null) continue;
      var scaled = Math.round(kg * mult);
      if (scaled < 1) scaled = 1;
      if (scaled > 250) scaled = 250;
      plan.sets[i].targetWeightKg = scaled;
    }
    return plan;
  }

  function isMachinePlanId(id) {
    return !!(id && id.indexOf("machine_") === 0);
  }

  function makeMachinePlan(exId, level) {
    var ex = EX[exId];
    if (!ex) return null;
    var def = MACHINE_DEFAULTS[exId] || { reps: 10, kg: 20 };
    var exercises = {};
    exercises[exId] = JSON.parse(JSON.stringify(ex));
    var plan = {
      id: "machine_" + exId,
      name: ex.name,
      exercises: exercises,
      sets: setsOf(exId, def.reps, def.kg, 2, { mid: 90, last: 0 })
    };
    return scalePlanWeights(plan, level || "beginner");
  }

  function clonePlan(id, level) {
    if (isMachinePlanId(id)) {
      return makeMachinePlan(id.slice(8), level);
    }
    var plan = JSON.parse(JSON.stringify(PLANS[id]));
    return scalePlanWeights(plan, level || "beginner");
  }

  function exerciseOf(plan, set) {
    return plan.exercises[set.exerciseId];
  }

  function setProgress(plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return { current: 0, total: 0 };
    var total = 0;
    var current = 0;
    for (var i = 0; i < plan.sets.length; i++) {
      if (plan.sets[i].exerciseId === set.exerciseId) {
        total++;
        if (i <= cursor) current++;
      }
    }
    return { current: current, total: total };
  }

  function formatWeight(kg) {
    if (kg == null) return "";
    return (kg % 1 === 0 ? String(kg) : kg.toFixed(1)) + " kg";
  }

  function formatClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function heroForSet(set, reps, ex) {
    if (ex && ex.unit === "time") return formatClock(reps);
    if (ex && ex.unit === "bodyweight") return reps + " reps";
    var w = formatWeight(set.targetWeightKg);
    return w ? w + " kg · " + reps : reps + " reps";
  }

  function needsTeach(state, plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return false;
    var ex = exerciseOf(plan, set);
    if (!ex || !ex.steps || !ex.steps.length) return false;
    if (state.taught.indexOf(ex.id) !== -1) return false;
    // Intermediate: skip teach if already learned in a past session
    if (state.level === "intermediate" && loadTaughtEver().indexOf(ex.id) !== -1) {
      return false;
    }
    // Beginner: always offer teach once per exercise this session
    return true;
  }

  function markTaught(state, plan, cursor) {
    var set = plan.sets[cursor];
    if (!set) return;
    var id = set.exerciseId;
    if (state.taught.indexOf(id) === -1) state.taught.push(id);
    persistTaught(id);
  }

  // --- Reducer ---
  function idleState(t) {
    return {
      schemaVersion: 2,
      planId: null,
      pendingGoal: null,
      level: null,
      mode: null,
      machinePage: 0,
      machineId: null,
      startedAt: null,
      cursor: 0,
      logged: [],
      phase: "Home",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      teachStep: 0,
      taught: [],
      menuReturn: null,
      paused: false,
      pendingCue: null
    };
  }

  function freshSession(planId, t, level) {
    var state = {
      schemaVersion: 2,
      planId: planId,
      pendingGoal: null,
      level: level || "beginner",
      mode: null,
      machinePage: 0,
      machineId: null,
      startedAt: t,
      cursor: 0,
      logged: [],
      phase: "Teach",
      phaseEnteredAt: t,
      setStartedAt: null,
      restEndsAt: null,
      adjust: null,
      teachStep: 0,
      taught: [],
      menuReturn: null,
      paused: false,
      pendingCue: null
    };
    return state;
  }

  function resolvePlanId(goal, equip) {
    if (equip === "free") return goal + "_free";
    return goal;
  }

  function resetToHome(t) {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    if (typeof resetPlanTo === "function") resetPlanTo("fullbody", "beginner");
    return idleState(t);
  }

  function enter(state, phase, t) {
    state.phase = phase;
    state.phaseEnteredAt = t;
    return state;
  }

  function clone(state) {
    return JSON.parse(JSON.stringify(state));
  }

  function withinIdempotency(state, t) {
    return t - state.phaseEnteredAt < IDEMPOTENCY_MS;
  }

  function logSet(state, plan, reps, t, adjusted) {
    var set = plan.sets[state.cursor];
    state.logged.push({
      planIndex: state.cursor,
      actualReps: reps,
      actualWeightKg: set.targetWeightKg,
      completedAt: t,
      restStartedAt: null,
      restEndedAt: null,
      restSkipped: false,
      adjusted: !!adjusted
    });
  }

  function goToCursorReadyOrTeach(state, plan, t) {
    state.setStartedAt = null;
    state.adjust = null;
    state.restEndsAt = null;
    if (needsTeach(state, plan, state.cursor)) {
      state.teachStep = 0;
      return enter(state, "Teach", t);
    }
    return enter(state, "SetReady", t);
  }

  function advanceAfterSet(state, plan, t) {
    var finished = plan.sets[state.cursor];
    state.cursor += 1;
    if (state.cursor >= plan.sets.length) {
      state.restEndsAt = null;
      state.setStartedAt = null;
      state.adjust = null;
      return enter(state, "Summary", t);
    }
    if (!finished.restSec) {
      return goToCursorReadyOrTeach(state, plan, t);
    }
    state.restEndsAt = t + finished.restSec * 1000;
    state.setStartedAt = null;
    state.adjust = null;
    var last = state.logged[state.logged.length - 1];
    last.restStartedAt = t;
    return enter(state, "Resting", t);
  }

  function endRest(state, t, skipped, plan) {
    var last = state.logged[state.logged.length - 1];
    if (last) {
      last.restEndedAt = t;
      last.restSkipped = !!skipped;
    }
    state.restEndsAt = null;
    if (state.cursor >= plan.sets.length) {
      return enter(state, "Summary", t);
    }
    return goToCursorReadyOrTeach(state, plan, t);
  }

  function finishTeach(state, plan, t) {
    markTaught(state, plan, state.cursor);
    state.teachStep = 0;
    return enter(state, "SetReady", t);
  }

  function reducer(state, event, t, plan) {
    state = clone(state);

    if (event.t === "VISIBILITY") {
      state.paused = !event.visible;
      if (event.visible && state.restEndsAt != null && t >= state.restEndsAt &&
          (state.phase === "Resting" || state.menuReturn === "Resting")) {
        var overdue = t - state.restEndsAt;
        state.menuReturn = null;
        state = endRest(state, t, false, plan);
        if (overdue <= STALE_CUE_MS) state.pendingCue = "rest_over";
      }
      return state;
    }

    if (event.t === "TICK") {
      if (state.restEndsAt != null && t >= state.restEndsAt &&
          (state.phase === "Resting" || state.menuReturn === "Resting")) {
        state.menuReturn = null;
        state = endRest(state, t, false, plan);
        state.pendingCue = "rest_over";
      }
      return state;
    }

    var navWhilePaused = {
      SELECT_HOME: 1, SELECT_PLAN: 1, SELECT_LEVEL: 1, SELECT_EQUIP: 1,
      SELECT_MACHINE: 1, MACHINE_MORE: 1, TRAIN_MACHINE: 1, BACK: 1,
      MACHINE_TIP: 1
    };
    if (state.paused && !navWhilePaused[event.t]) return state;

    if (event.t === "SELECT_HOME") {
      if (state.phase !== "Home" && state.phase !== "Idle") return state;
      if (event.mode === "train") {
        state.mode = "train";
        state.pendingGoal = null;
        state.level = null;
        state.machineId = null;
        return enter(state, "PlanSelect", t);
      }
      if (event.mode === "machines") {
        state.mode = "machines";
        state.machinePage = 0;
        state.machineId = null;
        state.pendingGoal = null;
        state.level = null;
        return enter(state, "MachineList", t);
      }
      return state;
    }

    if (event.t === "SELECT_PLAN") {
      if (state.phase !== "PlanSelect") return state;
      var goal = event.planId;
      if (goal !== "fullbody" && goal !== "upper" && goal !== "legs") return state;
      state.pendingGoal = goal;
      state.planId = null;
      state.level = null;
      return enter(state, "LevelSelect", t);
    }

    if (event.t === "SELECT_LEVEL") {
      if (state.phase !== "LevelSelect" || !state.pendingGoal) return state;
      if (event.level !== "beginner" && event.level !== "intermediate") return state;
      state.level = event.level;
      return enter(state, "EquipSelect", t);
    }

    if (event.t === "SELECT_EQUIP") {
      if (state.phase !== "EquipSelect" || !state.pendingGoal || !state.level) return state;
      var pid = resolvePlanId(state.pendingGoal, event.equip);
      if (!PLANS[pid]) return state;
      var lvl = state.level;
      resetPlanTo(pid, lvl);
      var session = freshSession(pid, t, lvl);
      return goToCursorReadyOrTeach(session, clonePlan(pid, lvl), t);
    }

    if (event.t === "SELECT_MACHINE") {
      if (state.phase !== "MachineList") return state;
      if (MACHINE_IDS.indexOf(event.machineId) === -1) return state;
      state.machineId = event.machineId;
      state.teachStep = 0;
      return enter(state, "MachineDetail", t);
    }

    if (event.t === "MACHINE_MORE") {
      if (state.phase !== "MachineList") return state;
      var next = (state.machinePage || 0) + 1;
      if (next * 2 >= MACHINE_IDS.length) return state;
      state.machinePage = next;
      state.phaseEnteredAt = t;
      return state;
    }

    if (event.t === "MACHINE_TIP") {
      if (state.phase !== "MachineDetail" || !state.machineId) return state;
      if (withinIdempotency(state, t)) return state;
      var mex = EX[state.machineId];
      var msteps = (mex && mex.steps) || [];
      if (!msteps.length) return state;
      state.teachStep = (state.teachStep + 1) % msteps.length;
      state.phaseEnteredAt = t;
      return state;
    }

    if (event.t === "TRAIN_MACHINE") {
      if (state.phase !== "MachineDetail" || !state.machineId) return state;
      var mpid = "machine_" + state.machineId;
      var mplan = makeMachinePlan(state.machineId, "beginner");
      if (!mplan) return state;
      resetPlanTo(mpid, "beginner");
      var mSession = freshSession(mpid, t, "beginner");
      return goToCursorReadyOrTeach(mSession, mplan, t);
    }

    if (event.t === "TEACH_NEXT") {
      if (state.phase !== "Teach") return state;
      if (withinIdempotency(state, t)) return state;
      var exT = exerciseOf(plan, plan.sets[state.cursor]);
      var steps = (exT && exT.steps) || [];
      if (state.teachStep >= steps.length - 1) {
        return finishTeach(state, plan, t);
      }
      state.teachStep += 1;
      state.phaseEnteredAt = t;
      return state;
    }

    if (event.t === "TEACH_SKIP") {
      if (state.phase !== "Teach") return state;
      if (withinIdempotency(state, t)) return state;
      return finishTeach(state, plan, t);
    }

    if (event.t === "HOW_TO") {
      if (state.phase !== "SetReady" && state.phase !== "Menu") return state;
      state.teachStep = 0;
      state.menuReturn = null;
      return enter(state, "Teach", t);
    }

    if (event.t === "BACK") {
      if (state.phase === "PlanSelect") {
        state.mode = null;
        state.pendingGoal = null;
        return enter(state, "Home", t);
      }
      if (state.phase === "LevelSelect") {
        state.level = null;
        return enter(state, "PlanSelect", t);
      }
      if (state.phase === "EquipSelect") {
        return enter(state, "LevelSelect", t);
      }
      if (state.phase === "MachineList") {
        // Back button only appears on the last page → always home
        state.mode = null;
        state.machineId = null;
        state.machinePage = 0;
        return enter(state, "Home", t);
      }
      if (state.phase === "MachineDetail") {
        state.machineId = null;
        state.teachStep = 0;
        return enter(state, "MachineList", t);
      }
      if (state.phase === "Menu") {
        var backTo = state.menuReturn || "SetReady";
        state.menuReturn = null;
        return enter(state, backTo, t);
      }
      if (state.phase === "QuitConfirm") {
        var ret = state.menuReturn || "SetReady";
        state.menuReturn = null;
        return enter(state, ret, t);
      }
      if (state.phase === "Teach") {
        // leave teach without marking taught if mid-flow from SetReady how-to
        state.teachStep = 0;
        return enter(state, "SetReady", t);
      }
      return state;
    }

    if (event.t === "OPEN_MENU") {
      if (state.phase !== "SetReady" && state.phase !== "Resting" && state.phase !== "Summary") return state;
      state.menuReturn = state.phase;
      return enter(state, "Menu", t);
    }

    if (event.t === "QUIT_ASK") {
      if (state.phase !== "Menu" && state.phase !== "SetReady" && state.phase !== "Resting" && state.phase !== "Summary" && state.phase !== "Teach") return state;
      if (state.phase !== "Menu") state.menuReturn = state.phase;
      return enter(state, "QuitConfirm", t);
    }

    if (event.t === "QUIT_CONFIRM") {
      if (state.phase !== "QuitConfirm") return state;
      if (withinIdempotency(state, t)) return state;
      return resetToHome(t);
    }

    if (event.t === "PRIMARY") {
      if (withinIdempotency(state, t)) return state;
      if (state.phase === "SetReady") {
        state.setStartedAt = t;
        state.adjust = null;
        return enter(state, "SetActive", t);
      }
      if (state.phase === "SetActive") {
        var reps = state.adjust ? state.adjust.reps : plan.sets[state.cursor].targetReps;
        var adjusted = !!(state.adjust && state.adjust.reps !== plan.sets[state.cursor].targetReps);
        logSet(state, plan, reps, t, adjusted);
        return advanceAfterSet(state, plan, t);
      }
      if (state.phase === "Resting") {
        return endRest(state, t, true, plan);
      }
      return state;
    }

    if (event.t === "ADJUST") {
      if (state.phase !== "SetReady") return state;
      var cur = plan.sets[state.cursor];
      state.adjust = { reps: cur.targetReps };
      return enter(state, "Adjusting", t);
    }

    if (event.t === "ADJUST_DELTA") {
      if (state.phase !== "Adjusting" || !state.adjust) return state;
      state.adjust.reps = Math.max(1, Math.min(50, state.adjust.reps + event.delta));
      return state;
    }

    if (event.t === "CONFIRM") {
      if (state.phase !== "Adjusting") return state;
      return enter(state, "SetReady", t);
    }

    if (event.t === "UNDO") {
      if (state.phase !== "Resting" && state.phase !== "Menu") return state;
      if (state.phase === "Menu" && state.menuReturn !== "Resting") return state;
      if (withinIdempotency(state, t)) return state;
      var popped = state.logged.pop();
      if (!popped) return state;
      state.cursor = popped.planIndex;
      state.restEndsAt = null;
      state.setStartedAt = popped.completedAt;
      state.adjust = null;
      state.menuReturn = null;
      return enter(state, "SetActive", t);
    }

    if (event.t === "FINISH") {
      if (state.phase !== "Summary") return state;
      return resetToHome(t);
    }

    if (event.t === "ADD_SET") {
      if (state.phase !== "Summary") return state;
      var lastSet = plan.sets[plan.sets.length - 1];
      plan.sets.push(JSON.parse(JSON.stringify(lastSet)));
      state.cursor = plan.sets.length - 1;
      state.adjust = null;
      return goToCursorReadyOrTeach(state, plan, t);
    }

    return state;
  }

  // --- Render ---
  function workoutProgress(state, plan) {
    if (!state || !plan || !plan.sets.length) return 0;
    return Math.min(1, state.logged.length / plan.sets.length);
  }

  function render(state, t, plan) {
    if (!state || state.phase === "Home" || state.phase === "Idle") {
      return {
        eyebrow: "SetPace",
        heading: "Let's train",
        hero: "",
        meta: "Learn exercises · follow a plan · Middle pinch closes app",
        demo: null,
        progress: null,
        mood: "home",
        actions: [
          { id: "mode_train", label: "Train", event: { t: "SELECT_HOME", mode: "train" } },
          { id: "mode_machines", label: "Exercises", event: { t: "SELECT_HOME", mode: "machines" } }
        ]
      };
    }

    if (state.phase === "PlanSelect") {
      return {
        eyebrow: "Train",
        heading: "What today?",
        hero: "",
        meta: "Pick a focus",
        demo: null,
        progress: null,
        mood: "home",
        actions: [
          { id: "plan_full", label: "Full body", event: { t: "SELECT_PLAN", planId: "fullbody" } },
          { id: "plan_upper", label: "Upper push", event: { t: "SELECT_PLAN", planId: "upper" } },
          { id: "plan_legs", label: "Legs", event: { t: "SELECT_PLAN", planId: "legs" } }
        ]
      };
    }

    if (state.phase === "LevelSelect") {
      var g0 = state.pendingGoal || "fullbody";
      var g0Label = g0 === "upper" ? "Upper" : (g0 === "legs" ? "Legs" : "Full body");
      return {
        eyebrow: g0Label,
        heading: "Level?",
        hero: "",
        meta: "Sets your starting weights",
        demo: null,
        progress: null,
        mood: "home",
        actions: [
          { id: "level_beg", label: "Beginner", event: { t: "SELECT_LEVEL", level: "beginner" } },
          { id: "level_int", label: "Intermediate", event: { t: "SELECT_LEVEL", level: "intermediate" } },
          { id: "back", label: "Back", event: { t: "BACK" } }
        ]
      };
    }

    if (state.phase === "EquipSelect") {
      var g = state.pendingGoal || "fullbody";
      var gLabel = g === "upper" ? "Upper" : (g === "legs" ? "Legs" : "Full body");
      var lvlTag = state.level === "intermediate" ? " · Intermediate" : " · Beginner";
      return {
        eyebrow: gLabel + lvlTag,
        heading: "Equipment?",
        hero: "",
        meta: "Machines or free weights",
        demo: null,
        progress: null,
        mood: "home",
        actions: [
          { id: "equip_m", label: "Machines", event: { t: "SELECT_EQUIP", equip: "machine" } },
          { id: "equip_f", label: "Free weights", event: { t: "SELECT_EQUIP", equip: "free" } },
          { id: "back", label: "Back", event: { t: "BACK" } }
        ]
      };
    }

    if (state.phase === "MachineList") {
      // Pages of 2 machines + More or Back (88px budget)
      var page = state.machinePage || 0;
      var start = page * 2;
      var pair = MACHINE_IDS.slice(start, start + 2);
      var hasMore = start + 2 < MACHINE_IDS.length;
      var mActions = [];
      for (var mi = 0; mi < pair.length; mi++) {
        var mid = pair[mi];
        mActions.push({
          id: "mach_" + mid,
          label: EX[mid].name,
          event: { t: "SELECT_MACHINE", machineId: mid }
        });
      }
      if (hasMore) {
        mActions.push({ id: "more", label: "More", event: { t: "MACHINE_MORE" } });
      } else {
        mActions.push({ id: "back", label: "Back", event: { t: "BACK" } });
      }
      return {
        eyebrow: "Exercises",
        heading: "Pick an exercise",
        hero: "",
        meta: "See the demo · then train it",
        demo: null,
        progress: null,
        mood: "home",
        actions: mActions
      };
    }

    if (state.phase === "MachineDetail") {
      var dex = EX[state.machineId];
      if (!dex) {
        return {
          eyebrow: "Exercises",
          heading: "Not found",
          hero: "",
          meta: "",
          demo: null,
          gif: null,
          progress: null,
          mood: "home",
          actions: [{ id: "back", label: "Back", event: { t: "BACK" } }]
        };
      }
      var dsteps = dex.steps || [];
      var didx = Math.min(state.teachStep || 0, Math.max(0, dsteps.length - 1));
      var dActions = [
        { id: "train_this", label: "Train this", event: { t: "TRAIN_MACHINE" } }
      ];
      if (dsteps.length > 1) {
        dActions.push({ id: "tip", label: "Next tip", event: { t: "MACHINE_TIP" } });
      }
      dActions.push({ id: "back", label: "Back", event: { t: "BACK" } });
      return {
        eyebrow: dex.trains || dex.cue || "Exercise",
        heading: dex.name,
        hero: dsteps[didx] || dex.cue || "",
        meta: (dex.cue || "Setup tip") + (dsteps.length ? " · " + (didx + 1) + "/" + dsteps.length : ""),
        demo: dex.demo || dex.id,
        gif: dex.gif || null,
        progress: null,
        mood: "teach",
        actions: dActions
      };
    }

    if (state.phase === "Menu") {
      var fromRest = state.menuReturn === "Resting";
      var fromSummary = state.menuReturn === "Summary";
      var actions = [];
      if (fromRest) {
        actions.push({ id: "undo", label: "Undo set", event: { t: "UNDO" } });
      } else if (!fromSummary) {
        actions.push({ id: "howto", label: "How to?", event: { t: "HOW_TO" } });
      }
      actions.push({ id: "quit", label: "End workout", event: { t: "QUIT_ASK" } });
      actions.push({ id: "back", label: "Back", event: { t: "BACK" } });
      return {
        eyebrow: "Menu",
        heading: "Options",
        hero: "",
        meta: fromRest ? "Rest keeps counting" : "Quick actions",
        demo: null,
        progress: workoutProgress(state, plan),
        mood: "home",
        actions: actions
      };
    }

    if (state.phase === "QuitConfirm") {
      return {
        eyebrow: "Leave workout?",
        heading: "End now?",
        hero: "",
        meta: "Progress will be cleared",
        demo: null,
        progress: workoutProgress(state, plan),
        mood: "home",
        actions: [
          { id: "primary", label: "Keep going", event: { t: "BACK" } },
          { id: "quit", label: "End workout", event: { t: "QUIT_CONFIRM" } }
        ]
      };
    }

    var pct = workoutProgress(state, plan);

    if (state.phase === "Teach") {
      var tset = plan.sets[state.cursor];
      var tex = exerciseOf(plan, tset);
      var steps = tex.steps || [];
      var idx = Math.min(state.teachStep, Math.max(0, steps.length - 1));
      var last = idx >= steps.length - 1;
      return {
        eyebrow: "Learn · " + (idx + 1) + "/" + steps.length,
        heading: tex.name,
        hero: steps[idx] || "",
        meta: tex.cue || "Follow the motion",
        demo: tex.demo || tex.id,
        gif: tex.gif || null,
        progress: pct,
        mood: "teach",
        actions: [
          { id: "primary", label: last ? "Let's go" : "Next", event: { t: "TEACH_NEXT" } },
          { id: "skip", label: "I know this", event: { t: "TEACH_SKIP" } }
        ]
      };
    }

    if (state.phase === "Adjusting") {
      var aset = plan.sets[state.cursor];
      var aex = exerciseOf(plan, aset);
      return {
        eyebrow: "Adjust",
        heading: aex.name,
        hero: String(state.adjust.reps) + (aex.unit === "time" ? " sec" : " reps"),
        meta: "Change then confirm",
        demo: null,
        progress: pct,
        mood: "ready",
        actions: [
          { id: "minus", label: "−1", event: { t: "ADJUST_DELTA", delta: -1 } },
          { id: "plus", label: "+1", event: { t: "ADJUST_DELTA", delta: 1 } },
          { id: "done", label: "Save", event: { t: "CONFIRM" } }
        ]
      };
    }

    if (state.phase === "Summary") {
      var volume = 0;
      for (var i = 0; i < state.logged.length; i++) {
        var L = state.logged[i];
        if (L.actualWeightKg != null) volume += L.actualWeightKg * L.actualReps;
      }
      var mins = Math.max(1, Math.round((t - state.startedAt) / 60000));
      return {
        eyebrow: "Nice work",
        heading: "Workout done",
        hero: state.logged.length + " sets",
        meta: mins + " min · " + Math.round(volume) + " kg",
        demo: null,
        progress: 1,
        mood: "summary",
        actions: [
          { id: "primary", label: "Home", event: { t: "FINISH" } },
          { id: "add", label: "Add set", event: { t: "ADD_SET" } }
        ]
      };
    }

    if (state.phase === "Resting") {
      var remain = Math.max(0, Math.ceil((state.restEndsAt - t) / 1000));
      var next = plan.sets[state.cursor];
      var nex = exerciseOf(plan, next);
      var nprog = setProgress(plan, state.cursor);
      var restMeta = remain <= 10
        ? "Get ready · " + nex.name
        : "Next: " + nex.name + " · " + nprog.current + "/" + nprog.total;
      return {
        eyebrow: remain <= 10 ? "Almost there" : "Rest · breathe",
        heading: nex.name,
        hero: formatClock(remain),
        meta: restMeta,
        demo: null,
        progress: pct,
        mood: "rest",
        actions: [
          { id: "primary", label: "Skip rest", event: { t: "PRIMARY" } },
          { id: "menu", label: "Menu", event: { t: "OPEN_MENU" } }
        ]
      };
    }

    var set = plan.sets[state.cursor];
    var ex = exerciseOf(plan, set);
    var prog = setProgress(plan, state.cursor);
    var reps = state.adjust ? state.adjust.reps : set.targetReps;
    var hero = heroForSet(set, reps, ex);

    if (state.phase === "SetActive") {
      return {
        eyebrow: "Set " + prog.current + "/" + prog.total + " · working",
        heading: ex.name,
        hero: hero,
        meta: "Tap when finished",
        demo: null,
        progress: pct,
        mood: "active",
        actions: [{ id: "primary", label: "Done", event: { t: "PRIMARY" } }]
      };
    }

    return {
      eyebrow: "Set " + prog.current + "/" + prog.total,
      heading: ex.name,
      hero: hero,
      meta: ex.cue || "Ready when you are",
      demo: null,
      progress: pct,
      mood: "ready",
      actions: [
        { id: "primary", label: "Start set", event: { t: "PRIMARY" } },
        { id: "menu", label: "Menu", event: { t: "OPEN_MENU" } }
      ]
    };
  }

  var demoKind = null;
  var demoStart = 0;

  function gifForKind(kind) {
    if (!kind) return null;
    if (EX[kind] && EX[kind].gif) return EX[kind].gif;
    for (var id in EX) {
      if (EX[id].demo === kind && EX[id].gif) return EX[id].gif;

  function strokeCyan(ctx, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#00e5ff";
    ctx.fillStyle = "#00e5ff";
    ctx.lineWidth = w || 4;
  }

  function strokeMute(ctx, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#5f8a92";
    ctx.lineWidth = w || 3;
  }

  function strokeHi(ctx, w) {
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#e8ffff";
    ctx.lineWidth = w || 3;
  }

  function head(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function line(ctx, x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // 0→1→0 smooth loop
  function wave(p) {
    return 0.5 - 0.5 * Math.cos(Math.PI * 2 * p);
  }

  // Arrow showing motion direction
  function arrow(ctx, x1, y1, x2, y2) {
    strokeHi(ctx, 2);
    line(ctx, x1, y1, x2, y2);
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var s = 8;
    line(ctx, x2, y2, x2 - s * Math.cos(ang - 0.4), y2 - s * Math.sin(ang - 0.4));
    line(ctx, x2, y2, x2 - s * Math.cos(ang + 0.4), y2 - s * Math.sin(ang + 0.4));
  }

    line(ctx, 55, 96, 90, 130); // torso on pad
    line(ctx, 90, 130, sled, 155); // thighs to platform

    strokeHi(ctx, 4);
    line(ctx, sled, 140, sled, 185); // foot plate
    line(ctx, sled - 14, 162, sled + 6, 162);

  // Standing at low cable, curl bar up
  function drawCableCurl(ctx, p) {
    var a = wave(p);
    var bend = a * 1.2;
    strokeMute(ctx, 3);
    line(ctx, 40, 20, 40, 200); // stack
    line(ctx, 40, 195, 90, 195); // low pulley
    strokeCyan(ctx, 4);
    head(ctx, 130, 45, 11);
    line(ctx, 130, 56, 130, 120);
    line(ctx, 130, 120, 110, 175);
    line(ctx, 130, 120, 150, 175);
    var ex = 150, ey = 95;
    line(ctx, 130, 75, ex, ey);
    var hx = ex + Math.cos(-0.3 - bend) * 42;
    var hy = ey + Math.sin(-0.3 - bend) * 42;
    line(ctx, ex, ey, hx, hy);
    strokeHi(ctx, 3);
    line(ctx, hx - 10, hy, hx + 10, hy);
    strokeMute(ctx, 2);
    line(ctx, 90, 195, hx, hy);

  // Forearm plank hold with breath pulse
  function drawPlank(ctx, p) {
    var pulse = 0.8 + 0.2 * Math.sin(p * Math.PI * 2);
    strokeMute(ctx, 3);
    line(ctx, 30, 170, 250, 170);
    strokeCyan(ctx, 4);
    ctx.globalAlpha = pulse;
    head(ctx, 55, 105, 10);
    line(ctx, 65, 112, 190, 112);
    line(ctx, 75, 112, 70, 155);
    line(ctx, 85, 112, 90, 155);
    line(ctx, 190, 112, 215, 155);
    line(ctx, 190, 112, 200, 155);
    ctx.globalAlpha = 1;
    strokeHi(ctx, 2);

    line(ctx, 120, 90, 120, 100);
    line(ctx, 140, 88, 140, 100);
    line(ctx, 160, 90, 160, 100);

  // Lying face-down (or seated side view): heels curl toward glutes
  function drawLegCurl(ctx, p) {

  function drawDemoFrame(kind, t0) {
    var ctx = demoCtx;
    var w = demoCanvas.width;
    var h = demoCanvas.height;
    ctx.clearRect(0, 0, w, h);
    var elapsed = (t0 - demoStart) / 1000;
    var period = kind === "plank" ? 1.8 : 1.6;
    var p = (elapsed % period) / period;
    var fn = DEMO_DRAW[kind] || drawChestPress;
    fn(ctx, p);
  }

  function startDemo(kind, gifOverride) {
    if (!kind) {
      stopDemo();
      return;
    }
    var gif = gifOverride || gifForKind(kind);
    if (gif) {
      if (demoKind === kind && demoMode === "gif" && demoGif.getAttribute("src") === gif) return;
      stopDemo();
      demoKind = kind;
      demoMode = "gif";
      demoCanvas.classList.add("off");
      demoGif.src = gif;
      demoGif.classList.add("on");
      demoCredit.textContent = "Demo © Gym visual";
      demoCredit.classList.add("on");
      return;
    }
    if (demoKind === kind && demoMode === "canvas" && demoRaf) return;
    stopDemo();
    demoKind = kind;
    demoMode = "canvas";
    demoStart = performance.now();
    function loop(ts) {
      drawDemoFrame(kind, ts);
      demoRaf = requestAnimationFrame(loop);
    }
    demoRaf = requestAnimationFrame(loop);
  }

  // --- Audio + flash ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone() {
    try {
      var ctx = ensureAudio();
      if (!ctx) return;
      var t0 = ctx.currentTime;
      function chime(freq, at, dur, vol) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.value = 0.0001;
        o.connect(g);
        g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(vol, at + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.start(at);
        o.stop(at + dur + 0.02);
      }
      chime(523.25, t0, 0.28, 0.16);
      chime(659.25, t0 + 0.14, 0.32, 0.14);
      chime(783.99, t0 + 0.28, 0.45, 0.12);
    } catch (e) {}
  }

  function flashPulse() {
    var el = document.getElementById("flash");
    var n = 0;
    function beat() {
      el.classList.add("on");
      setTimeout(function () {
        el.classList.remove("on");
        n++;
        if (n < 2) setTimeout(beat, 160);
      }, 220);
    }
    beat();
  }

  function fireCue() {
    playTone();
    flashPulse();
  }

  // --- DOM commit ---
  var appEl = document.getElementById("app");
  var eyebrowEl = document.getElementById("eyebrow");
  var headingEl = document.getElementById("heading");
  var heroEl = document.getElementById("hero");
  var metaEl = document.getElementById("meta");
  var demoWrap = document.getElementById("demoWrap");
  var progressEl = document.getElementById("progress");
  var progressFill = document.getElementById("progressFill");
  var actionsEl = document.getElementById("actions");
  var lastFocusId = "primary";
  var actionHandlers = {};
  var moodClasses = ["teach", "rest", "summary", "active", "ready", "home"];

  function commit(frame) {
    eyebrowEl.textContent = frame.eyebrow || "";
    headingEl.textContent = frame.heading || "";
    heroEl.textContent = frame.hero || "";
    if (!frame.hero) heroEl.classList.add("empty");
    else heroEl.classList.remove("empty");
    metaEl.textContent = frame.meta || "";

    for (var m = 0; m < moodClasses.length; m++) {
      appEl.classList.remove(moodClasses[m]);
    }
    if (frame.mood) appEl.classList.add(frame.mood);

    if (frame.progress == null) {
      progressEl.classList.remove("on");
    } else {
      progressEl.classList.add("on");
      progressFill.style.width = Math.round(frame.progress * 100) + "%";
    }

    if (frame.demo) {
      demoWrap.classList.add("on");
      startDemo(frame.demo, frame.gif || null);
    } else {
      demoWrap.classList.remove("on");
      stopDemo();
    }

    var existing = {};
    var kids = actionsEl.querySelectorAll(".btn");
    for (var i = 0; i < kids.length; i++) {
      existing[kids[i].dataset.id] = kids[i];
    }

    var keep = {};
    for (var a = 0; a < frame.actions.length; a++) {
      var action = frame.actions[a];
      keep[action.id] = true;
      actionHandlers[action.id] = action.event;
      var btn = existing[action.id];
      if (!btn) {
        btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.dataset.id = action.id;
        btn.addEventListener("click", function (ev) {
          var id = ev.currentTarget.dataset.id;
          dispatch(actionHandlers[id]);
        });
      }
      btn.textContent = action.label;
      btn.className = "btn" + (a === 0 ? " primary" : "");
      if (btn.parentNode !== actionsEl || actionsEl.children[a] !== btn) {
        actionsEl.insertBefore(btn, actionsEl.children[a] || null);
      }
    }

    for (var id in existing) {
      if (!keep[id]) existing[id].remove();
    }

    var focusTarget = actionsEl.querySelector('[data-id="' + lastFocusId + '"]') ||
      actionsEl.querySelector(".btn");
    if (focusTarget) {
      focusTarget.focus();
      lastFocusId = focusTarget.dataset.id;
    }
  }

  // --- App loop ---
  var state = null;
  var tickTimer = null;
  var plan = clonePlan("fullbody", "beginner");

  function resetPlanTo(planId, level) {
    if (!planId) return;
    if (PLANS[planId] || isMachinePlanId(planId)) {
      plan = clonePlan(planId, level || "beginner");
    }
  }

  function save() {
    if (!state || PRE_WORKOUT[state.phase]) {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      return;
    }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        state: state,
        planId: state.planId,
        level: state.level || "beginner",
        planSetsLen: plan.sets.length
      }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var wrapped = JSON.parse(raw);
      var s = wrapped.state || wrapped;
      if (!s || (s.schemaVersion !== 2 && s.schemaVersion !== 1)) return null;
      if (s.startedAt && now() - s.startedAt > 6 * 60 * 60 * 1000) {
        localStorage.removeItem(STORE_KEY);
        return null;
      }
      var pid = wrapped.planId || s.planId;
      var lvl = wrapped.level || s.level || "beginner";
      if (!pid || (!PLANS[pid] && !isMachinePlanId(pid))) return null;
      if (isMachinePlanId(pid) && !EX[pid.slice(8)]) return null;
      s.level = lvl;
      resetPlanTo(pid, lvl);
      var baseLen = plan.sets.length;
      // For catalog plans, base length is unscaled template length
      if (PLANS[pid]) baseLen = PLANS[pid].sets.length;
      var extra = (wrapped.planSetsLen || plan.sets.length) - baseLen;
      if (extra > 0) {
        var template = PLANS[pid]
          ? PLANS[pid].sets[PLANS[pid].sets.length - 1]
          : plan.sets[plan.sets.length - 1];
        for (var i = 0; i < extra; i++) {
          plan.sets.push(JSON.parse(JSON.stringify(template)));
          if (plan.sets[plan.sets.length - 1].targetWeightKg != null && lvl === "intermediate") {
            var sw = Math.round(plan.sets[plan.sets.length - 1].targetWeightKg * LEVEL_MULT.intermediate);
            if (sw > 250) sw = 250;
            plan.sets[plan.sets.length - 1].targetWeightKg = sw;
          }
        }
      }
      if (!s.taught) s.taught = [];
      if (s.teachStep == null) s.teachStep = 0;
      if (s.machinePage == null) s.machinePage = 0;
      s.schemaVersion = 2;
      return s;
    } catch (e) { return null; }
  }

  function paint() {
    var frame = render(state, now(), plan);
    commit(frame);
  }

  function scheduleTick() {
    if (tickTimer) {
      clearTimeout(tickTimer);
      tickTimer = null;
    }
    if (!state || state.restEndsAt == null) return;
    if (state.phase !== "Resting" && state.menuReturn !== "Resting") return;
    var t = now();
    var delay = Math.max(50, 1000 - (t % 1000));
    tickTimer = setTimeout(function () {
      dispatch({ t: "TICK" });
    }, delay);
  }

  function dispatch(event) {
    if (!event) return;
    var prevPhase = state && state.phase;
    var t = now();

    if (!state) {
      state = idleState(t);
    }

    if (event.t === "SELECT_EQUIP" || event.t === "TRAIN_MACHINE") {
      state = reducer(state, event, t, plan);
      if (state.planId) resetPlanTo(state.planId, state.level || "beginner");
      lastFocusId = "primary";
      if (state.pendingCue === "rest_over") {
        state.pendingCue = null;
        fireCue();
      }
      save();
      paint();
      scheduleTick();
      return;
    }

    if (event.t === "SELECT_HOME") {
      state = reducer(state, event, t, plan);
      lastFocusId = state.phase === "MachineList" ? "mach_" + MACHINE_IDS[0] : "plan_full";
      save();
      paint();
      scheduleTick();
      return;
    }

    if (event.t === "SELECT_PLAN") {
      state = reducer(state, event, t, plan);
      lastFocusId = "level_beg";
      save();
      paint();
      scheduleTick();
      return;
    }

    if (event.t === "SELECT_LEVEL") {
      state = reducer(state, event, t, plan);
      lastFocusId = "equip_m";
      save();
      paint();
      scheduleTick();
      return;
    }

    state = reducer(state, event, t, plan);

    if (state.planId && (!plan || plan.id !== state.planId)) {
      if (PLANS[state.planId] || isMachinePlanId(state.planId)) {
        resetPlanTo(state.planId, state.level || "beginner");
      }
    }

    if (state.pendingCue === "rest_over") {
      state.pendingCue = null;
      fireCue();
    }

    if (state.phase !== prevPhase) {
      lastFocusId = "primary";
      if (state.phase === "Adjusting") lastFocusId = "minus";
      if (state.phase === "Home") lastFocusId = "mode_train";
      if (state.phase === "PlanSelect") lastFocusId = "plan_full";
      if (state.phase === "LevelSelect") lastFocusId = "level_beg";
      if (state.phase === "EquipSelect") lastFocusId = "equip_m";
      if (state.phase === "MachineList") {
        lastFocusId = "mach_" + MACHINE_IDS[(state.machinePage || 0) * 2];
      }
      if (state.phase === "MachineDetail") lastFocusId = "train_this";
      if (state.phase === "Menu") {
        lastFocusId = state.menuReturn === "Resting" ? "undo"
          : (state.menuReturn === "Summary" ? "quit" : "howto");
      }
      if (state.phase === "QuitConfirm") lastFocusId = "primary";
      save();
    } else if (
      event.t === "ADJUST_DELTA" || event.t === "CONFIRM" ||
      event.t === "TEACH_NEXT" || event.t === "MACHINE_MORE" || event.t === "MACHINE_TIP"
    ) {
      save();
      if (event.t === "MACHINE_MORE") {
        lastFocusId = "mach_" + MACHINE_IDS[(state.machinePage || 0) * 2];
      }
    }

    paint();
    scheduleTick();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      var buttons = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx = buttons.indexOf(document.activeElement);
      var next = buttons[Math.min(buttons.length - 1, Math.max(0, idx) + 1)] || buttons[0];
      if (next) {
        next.focus();
        lastFocusId = next.dataset.id;
      }
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
      e.preventDefault();
      var buttons2 = Array.prototype.slice.call(actionsEl.querySelectorAll(".btn"));
      var idx2 = buttons2.indexOf(document.activeElement);
      var prev = buttons2[Math.max(0, (idx2 < 0 ? 0 : idx2) - 1)] || buttons2[0];
      if (prev) {
        prev.focus();
        lastFocusId = prev.dataset.id;
      }
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      ensureAudio();
      var focused = document.activeElement;
      if (focused && focused.classList.contains("btn")) {
        lastFocusId = focused.dataset.id;
        dispatch(actionHandlers[focused.dataset.id]);
      } else {
        var first = actionsEl.querySelector(".btn");
        if (first) dispatch(actionHandlers[first.dataset.id]);
      }
    }
  });

  document.addEventListener("visibilitychange", function () {
    dispatch({ t: "VISIBILITY", visible: !document.hidden });
  });

  // Boot
  var saved = load();
  if (saved && saved.phase && !PRE_WORKOUT[saved.phase]) {
    state = saved;
    state.paused = document.hidden;
    if (state.phase === "Resting" && state.restEndsAt != null && now() >= state.restEndsAt) {
      dispatch({ t: "VISIBILITY", visible: true });
    } else {
      paint();
      scheduleTick();
    }
  } else {
    state = idleState(now());
    lastFocusId = "mode_train";
    paint();
  }
})();
</script>
</body>
</html>
