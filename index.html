<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>SetPace</title>
<style>
:root {
  --bg: #000;
  --fg: #ecfeff;
  --accent: #5eead4;
  --accent2: #67e8f9;
  --muted: #94b8bc;
  --card: #071a1c;
  --card-hi: #0c2c30;
  --line: #1a4a50;
  --danger: #fb7185;
  --good: #86efac;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 600px;
  height: 600px;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: "Segoe UI", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
}
#app {
  width: 600px;
  height: 600px;
  display: flex;
  flex-direction: column;
  padding: 16px 22px 12px;
  position: relative;
}
#eyebrow {
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  min-height: 20px;
  margin-bottom: 4px;
}
#heading {
  font-size: 30px;
  font-weight: 800;
  color: var(--accent2);
  line-height: 1.15;
  min-height: 36px;
}
#progress {
  display: none;
  height: 6px;
  background: #0a2226;
  border-radius: 99px;
  margin: 10px 0 6px;
  overflow: hidden;
}
#progress.on { display: block; }
#progress > i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.35s ease;
}
#demoWrap {
  display: none;
  width: 280px;
  height: 210px;
  margin: 6px auto 2px;
  flex-shrink: 0;
  border-radius: 16px;
  outline: 1px solid var(--line);
  overflow: hidden;
  position: relative;
  background: #030d0e;
}
#demoWrap.on { display: block; }
#demo {
  width: 280px;
  height: 210px;
  display: block;
  background: #030d0e;
}
#demo.off { display: none; }
#demoGif {
  display: none;
  width: 280px;
  height: 210px;
  object-fit: contain;
  background: #030d0e;
}
#demoGif.on { display: block; }
#demoCredit {
  display: none;
  text-align: center;
  font-size: 12px;
  color: #5a7a7e;
  margin: 0 0 2px;
  min-height: 0;
}
#demoCredit.on { display: block; }
#hero {
  font-size: 58px;
  font-weight: 800;
  line-height: 1.05;
  margin: 10px 0 6px;
  min-height: 64px;
  color: var(--fg);
  letter-spacing: -0.02em;
}
#hero.empty {
  min-height: 0;
  margin: 0;
  font-size: 0;
}
#app.teach #hero {
  font-size: 24px;
  font-weight: 700;
  min-height: 30px;
  margin: 4px 0 2px;
  color: var(--fg);
}
#app.rest #hero {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
#app.summary #heading { color: var(--good); }
#app.summary #hero { color: var(--good); font-size: 48px; }
#meta {
  font-size: 18px;
  color: var(--muted);
  min-height: 24px;
  margin-bottom: 8px;
  line-height: 1.3;
}
#actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn {
  min-height: 88px;
  width: 100%;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--fg);
  font-size: 26px;
  font-weight: 700;
  border-radius: 16px;
  text-align: left;
  direction: ltr;
  padding: 0 24px;
  outline: none;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn.primary {
  border-color: var(--accent);
  background: var(--card-hi);
  color: var(--accent2);
}
.btn:focus {
  border-color: var(--accent2);
  box-shadow: inset 0 0 0 3px rgba(94, 234, 212, 0.55);
  background: #10383e;
}
#flash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 40%, #a5f3fc 0%, #22d3ee 45%, #000 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
  transition: opacity 0.12s ease;
}
#flash.on { opacity: 0.92; }
#error {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  color: var(--danger);
  padding: 24px;
  font-size: 18px;
  white-space: pre-wrap;
  z-index: 10000;
}
.desktop-hint { display: none; }
@media (min-width: 700px) {
  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
  }
  #app { outline: 1px solid #1e293b; border-radius: 8px; }
  .desktop-hint {
    display: block;
    position: fixed;
    bottom: 12px;
    left: 12px;
    color: #64748b;
    font-size: 13px;
  }
}
</style>
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<pre id="error"></pre>

/* module: plan */
(function () {
  "use strict";

  function isMachinePlanId(id) {
    return !!(id && id.indexOf("machine_") === 0);
  }

  function scalePlanWeights(plan, level, LEVEL_MULT) {
    var mult = LEVEL_MULT[level] || 1;
    if (mult === 1) return plan;
    for (var i = 0; i < plan.sets.length; i++) {
      var kg = plan.sets[i].targetWeightKg;
      if (kg == null) continue;
      var scaled = Math.round(kg * mult);
      if (scaled < 1) scaled = 1;
      if (scaled > 250) scaled = 250;
      plan.sets[i].targetWeightKg = scaled;
    }
    return plan;
  }

  function makeMachinePlan(EX, MACHINE_DEFAULTS, LEVEL_MULT, exId, level) {
    var ex = EX[exId];
    if (!ex) return null;
    var def = MACHINE_DEFAULTS[exId] || { reps: 10, kg: 20 };
    var exercises = {};
    exercises[exId] = JSON.parse(JSON.stringify(ex));
    var plan = {
      id: "machine_" + exId,
      name: ex.name,
      exercises: exercises,

/* module: audio */
(function () {
  "use strict";

  var ctx = null;

  function ensureAudio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function playTone() {
    try {
      var c = ensureAudio();
      if (!c) return;
      var t0 = c.currentTime;
      function chime(freq, at, dur, vol) {
        var o = c.createOscillator();
        var g = c.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.value = 0.0001;
        o.connect(g);
        g.connect(c.destination);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(vol, at + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        o.start(at);
        o.stop(at + dur + 0.02);
      }
      chime(523.25, t0, 0.28, 0.16);
      chime(659.25, t0 + 0.14, 0.32, 0.14);
      chime(783.99, t0 + 0.28, 0.45, 0.12);
    } catch (e) {}
  }

  function flashPulse() {
    try {
      var el = document.getElementById("flash");
      if (!el) return;
      var n = 0;
      function beat() {
        el.classList.add("on");
        setTimeout(function () {
          el.classList.remove("on");
          n++;
          if (n < 2) setTimeout(beat, 160);
        }, 220);
      }
      beat();
    } catch (e) {}
  }

  function fireCue() {
    playTone();
    flashPulse();
  }

  var api = { ensureAudio: ensureAudio, playTone: playTone, flashPulse: flashPulse, fireCue: fireCue };

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else SetPace.api.audio = api;
})();

/* module: storage (localStorage adapter; schema v2) */
(function () {
  "use strict";

  function save(STORE_KEY, PRE_WORKOUT, state, plan) {
    if (!state || PRE_WORKOUT[state.phase]) {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      return;
    }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        state: state,
        planId: state.planId,
        level: state.level || "beginner",
        planSetsLen: plan.sets.length
      }));
    } catch (e) {}
  }

  function load(STORE_KEY, deps) {
    var now = deps.now;
    var PLANS = deps.PLANS;
    var EX = deps.EX;
    var LEVEL_MULT = deps.LEVEL_MULT;
    var isMachinePlanId = deps.isMachinePlanId;
    var clonePlan = deps.clonePlan;
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var wrapped = JSON.parse(raw);
      var s = wrapped.state || wrapped;
      if (!s || (s.schemaVersion !== 2 && s.schemaVersion !== 1)) return null;
      if (s.startedAt && now() - s.startedAt > 6 * 60 * 60 * 1000) {
        localStorage.removeItem(STORE_KEY);
        return null;
      }
      var pid = wrapped.planId || s.planId;
      var lvl = wrapped.level || s.level || "beginner";
      if (!pid || (!PLANS[pid] && !isMachinePlanId(pid))) return null;
      if (isMachinePlanId(pid) && !EX[pid.slice(8)]) return null;
      s.level = lvl;
      var plan = clonePlan(pid, lvl);
      var baseLen = plan.sets.length;
      if (PLANS[pid]) baseLen = PLANS[pid].sets.length;
      var extra = (wrapped.planSetsLen || plan.sets.length) - baseLen;
      if (extra > 0) {
        var template = PLANS[pid]
          ? PLANS[pid].sets[PLANS[pid].sets.length - 1]
          : plan.sets[plan.sets.length - 1];
        for (var i = 0; i < extra; i++) {
          plan.sets.push(JSON.parse(JSON.stringify(template)));
          if (plan.sets[plan.sets.length - 1].targetWeightKg != null && lvl === "intermediate") {
            var sw = Math.round(plan.sets[plan.sets.length - 1].targetWeightKg * LEVEL_MULT.intermediate);
            if (sw > 250) sw = 250;
            plan.sets[plan.sets.length - 1].targetWeightKg = sw;
          }
        }
      }
      if (!s.taught) s.taught = [];
      if (s.teachStep == null) s.teachStep = 0;
      if (s.machinePage == null) s.machinePage = 0;
      s.schemaVersion = 2;
      return { state: s, plan: plan };
    } catch (e) { return null; }
  }

  var api = { save: save, load: load };

  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else SetPace.api.storage = api;
})();

      if (state.phase === "Resting" && state.restEndsAt != null && now() >= state.restEndsAt) {
        dispatch({ t: "VISIBILITY", visible: true });
      } else {
        paint();
        scheduleRestTick();
      }
    } else {
      state = idleState(now());
      lastFocusId = "mode_train";
      paint();
    }
  }

  SetPace.boot = boot;
})();
  if (SetPace.boot) SetPace.boot();
})();
</script>
